<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>axworld.my — Under Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Cinzel:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0f172a;
      overflow: hidden;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 440px;
    }

    /* KONTENA GAMBAR: KECIL COMEL & TERAPUNG LEMBUT */
    .image-box {
      width: 500px;
      max-width: 70vw;
      margin-bottom: 12px;
      }

    .image-box img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.06));
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    /* TIPOGRAFI BERSIH & MODEN */
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #d97706; /* Emas AXWORLD */
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    p {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      line-height: 1.6;
    }

    /* GARIS STATUS KECIL */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-top: 16px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
    }

    .indicator {
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- GAMBAR KREN CHIBI -->
    <div class="image-box">
      <img src="chibi_crane.png" alt="AXWORLD.MY Under Construction" />
    </div>

    <!-- TEKS ELEGAN -->
    <div class="brand">AXWORLD.MY</div>
    <h1>Building Something Great</h1>
    
    <!-- STATUS AKTIF -->
    <div class="status-pill">
      <span class="indicator"></span>
      <span>System Deployment in Progress</span>
    </div>
  </div>

</body>
</html>
