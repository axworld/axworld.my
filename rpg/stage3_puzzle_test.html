<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STAGE 3 TESTBENCH — THE SCRIPTORIUM & SECRET DOOR MECHANISM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #030712; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #gameCanvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud-glass {
      background: rgba(10, 16, 31, 0.92);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .test-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #fde047;
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .test-btn:hover { background: #d97706; color: #000; }
  </style>
</head>
<body class="w-full h-full flex flex-col items-center justify-center bg-[#030712] p-2">

  <div id="canvasFrame" class="relative w-full max-w-[1280px] max-h-[92vh] aspect-video flex items-center justify-center overflow-hidden border-2 border-amber-500/40 rounded-xl bg-slate-950 shadow-2xl">
    <canvas id="gameCanvas" width="960" height="540" class="w-full h-full block"></canvas>

    <!-- STATUS BAR ATAS -->
    <div class="pointer-events-none absolute top-3 inset-x-3 flex justify-between items-center z-20">
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-amber-300">
        CHAPTER III PUZZLE TEST: THE ARCHIVE SECRET GEAR MECHANISM
      </div>
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-cyan-300">
        DEBUG HITBOX [G]: <span id="debugStatus" class="text-emerald-400">ON</span>
      </div>
    </div>

    <!-- PROMPT INTERAKSI [E] -->
    <div id="interactPrompt" class="hidden pointer-events-none absolute top-20 left-1/2 -translate-x-1/2 z-30 hud-glass px-4 py-2 rounded-xl text-center border-amber-400 animate-pulse">
      <div class="text-[9px] text-amber-300">📖 PRESS [E] TO PULL SECRET ANCIENT TOME</div>
    </div>

    <!-- PANDUAN KAWALAN DESKTOP DI BAWAH -->
    <div class="hidden md:flex pointer-events-none absolute bottom-2 inset-x-0 justify-center items-center z-20">
      <div class="hud-glass rounded-lg px-3 py-1 flex items-center gap-3 text-[7px] text-amber-300 font-bold border border-amber-500/40 shadow-lg">
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">A</kbd><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">D</kbd> MOVE</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">W</kbd><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">S</kbd> CLIMB</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-amber-300 px-1.5 rounded border border-slate-700">SPACE</kbd> JUMP</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-emerald-300 px-1 rounded border border-slate-700">E</kbd> INTERACT</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-amber-400 px-1 rounded border border-slate-700">G</kbd> DEBUG</span>
      </div>
    </div>

    <!-- BUTANG TEST BENCH CEPAT -->
    <div class="absolute bottom-10 right-3 flex flex-col gap-1.5 z-30">
      <button class="test-btn" onclick="triggerSecretDoor()">Toggle Door [E]</button>
      <button class="test-btn" onclick="teleportHero('table')">TP to Secret Tome</button>
      <button class="test-btn" onclick="teleportHero('door')">TP to Door Wall</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ===================================================================
      // 1. ASSETS LOADER
      // ===================================================================
      const CANDIDATES = {
        hero: ["hero_azzumie_spritesheet.png", "hero_azzumie_spritesheet_3.jpg"],
        page1: ["stage3_bg_page1.jpg", "stage3_bg_page1.jpg"]
      };

      const Loaded = {
        images: {},
        init(onComplete) {
          const keys = Object.keys(CANDIDATES);
          let count = 0;
          let completed = false;

          const doneCheck = () => {
            if (!completed) {
              completed = true;
              onComplete();
            }
          };

          setTimeout(doneCheck, 2000);

          keys.forEach((k) => {
            const list = CANDIDATES[k];
            let idx = 0;
            const tryNext = () => {
              if (idx >= list.length) {
                count++;
                if (count === keys.length) doneCheck();
                return;
              }
              const src = list[idx++];
              const img = new Image();
              img.onload = () => {
                Loaded.images[k] = img;
                count++;
                if (count === keys.length) doneCheck();
              };
              img.onerror = () => tryNext();
              img.src = src;
            };
            tryNext();
          });
        },
        get(k) {
          const img = this.images[k];
          return (img && img.complete && img.naturalWidth > 0) ? img : null;
        }
      };

      // ===================================================================
      // 2. RETRO AUDIO SYNTH (BUNYI GEAR & GEMPA)
      // ===================================================================
      const AudioEngine = {
        ctx: null,
        init() {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        },
        playTone(freq, duration, type = 'sine', slideTo = null, vol = 0.2) {
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch(e){}
        },
        jump() { this.playTone(200, 0.12, 'square', 480, 0.1); },
        gearClank() {
          this.playTone(120, 0.35, 'sawtooth', 40, 0.3);
          this.playTone(85, 0.4, 'square', 30, 0.25);
        },
        unlocked() {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            setTimeout(() => this.playTone(f, 0.25, 'triangle', null, 0.15), i * 60);
          });
        }
      };

      // ===================================================================
      // 3. CANVAS, KAMERA & FIZIK
      // ===================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const VIEW_W = 960;
      const VIEW_H = 540;
      const WORLD_W = 960; // Untuk Page 1 testbench
      const GRAVITY = 0.52;

      const camera = { x: 0, targetX: 0, shakeFrames: 0, shakeMag: 0 };
      let showDebugRoute = true;

      // ===================================================================
      // 4. SUSUNAN PLATFORM & TANGGA MENGIKUT GAMBAR 2
      // ===================================================================
      const platforms = [
        // A. Lantai Utama Bawah
        { id: 'floor_ground', type: 'flat', x: 0, y: 470, w: 960, h: 70 },

        // B. Mezanin Tingkat 1 (Kiri Atas Rak Buku)
        { id: 'mezzanine_mid_left', type: 'flat', x: 0, y: 340, w: 220, h: 18 },

        // C. Mezanin Tengah (Atas Rak Tengah Tempat Buku & Tangga)
        { id: 'shelf_center_mid', type: 'flat', x: 220, y: 340, w: 280, h: 20 },
        { id: 'shelf_center_top', type: 'flat', x: 280, y: 240, w: 180, h: 18 },

        // D. Jambatan Kayu Mezanin Atas (Menghubungkan ke kanan)
        { id: 'high_bridge_beam', type: 'flat', x: 520, y: 200, w: 230, h: 18 },

        // E. Pelantar Rak Bawah Kanan (Sebelum Pintu Rahsia)
        { id: 'step_before_door', type: 'flat', x: 740, y: 470, w: 50, h: 20 },

        // F. DINDING PEPEJAL PINTU RAHSIATERKUNCI (X: 790, Y: 170, W: 20, H: 300)
        { id: 'secret_door_wall', type: 'wall', x: 790, y: 170, w: 25, h: 300 }
      ];

      // Tangga Memanjat (Sesuai dengan tangga beroda di Gambar 2)
      const ladders = [
        { id: 'ladder_1_left', x: 62, w: 32, topY: 190, bottomY: 470 }, // Tangga tinggi kiri
        { id: 'ladder_center_wood', x: 225, w: 30, topY: 240, bottomY: 340 }
      ];

      // ===================================================================
      // 5. MEKANIK PINTU RAHSIAGERAKAN SLIDING GEAR DROP
      // ===================================================================
      const secretMechanism = {
        // Lokasi Meja Kitab Rahsia (Tempat Hero Tekan E)
        tomeX: 625,
        tomeY: 470,
        tomeW: 60,
        tomeH: 40,

        // Kedudukan Rak Pintu Rahsia di Kanvas
        doorX: 790,
        doorY: 170,
        doorW: 165,
        doorH: 300,

        // Parameter Animasi
        doorOffsetY: 0,       // Berapa banyak pintu dah melongsor turun
        maxDropY: 295,        // Tenggelam sepenuhnya ke bawah lantai
        isOpening: false,
        isOpen: false,
        gearRotation: 0,      // Sudut putaran gear mekanikal
        doorWallRef: platforms.find(p => p.id === 'secret_door_wall')
      };

      // ===================================================================
      // 6. KONFIGURASI HERO
      // ===================================================================
      const HERO_CONFIG = {
        rows: 5,
        renderSize: 120,
        offsetX: -60,
        offsetY: -100,
        actions: {
          idle:    { row: 0, cols: 10, startCol: 0, count: 5, fps: 6,  loop: true },
          run:     { row: 1, cols: 8,  startCol: 0, count: 6, fps: 14, loop: true },
          jump:    { row: 2, cols: 10, startCol: 2, count: 1, fps: 1,  loop: false },
          fall:    { row: 2, cols: 10, startCol: 3, count: 1, fps: 1,  loop: false },
          climb:   { row: 0, cols: 10, startCol: 7, count: 3, fps: 7,  loop: true }, // Talaan kemas Row 0
          slash:   { row: 3, cols: 9,  startCol: 0, count: 6, fps: 17, loop: false }
        }
      };

      const hero = {
        x: 90,
        y: 380,
        w: 48,
        h: 76,
        vx: 0,
        vy: 0,
        speed: 4.5,
        facing: 1,
        grounded: false,
        climbing: false,
        activeLadder: null,
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        coyoteTimer: 0,
        jumpBuffer: 0
      };

      const floatingPopups = [];
      function addFloatingPopup(text, x, y, color = '#f59e0b') {
        floatingPopups.push({ text, x, y, color, life: 60, maxLife: 60 });
      }

      // ===================================================================
      // 7. INPUT & KAWALAN
      // ===================================================================
      const input = { left: false, right: false, up: false, down: false, jumpHeld: false };

      function triggerJump() {
        AudioEngine.init();
        hero.jumpBuffer = 8;
        if (hero.climbing) {
          hero.climbing = false;
          hero.vy = -10.5;
        }
      }

      window.triggerSecretDoor = function() {
        AudioEngine.init();
        if (secretMechanism.isOpen || secretMechanism.isOpening) return;

        secretMechanism.isOpening = true;
        AudioEngine.gearClank();
        camera.shakeFrames = 35;
        camera.shakeMag = 5;
        addFloatingPopup('⚙️ SECRET GEARS ACTIVATED!', secretMechanism.tomeX - 30, secretMechanism.tomeY - 40, '#fde047');
      };

      window.teleportHero = function(target) {
        if (target === 'table') {
          hero.x = secretMechanism.tomeX - 20;
          hero.y = secretMechanism.tomeY - hero.h;
        } else if (target === 'door') {
          hero.x = secretMechanism.doorX - 60;
          hero.y = 470 - hero.h;
        }
        hero.vx = 0;
        hero.vy = 0;
        hero.climbing = false;
      };

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        AudioEngine.init();

        if (e.code === 'KeyG') {
          showDebugRoute = !showDebugRoute;
          const status = document.getElementById('debugStatus');
          status.textContent = showDebugRoute ? 'ON' : 'OFF';
          status.className = showDebugRoute ? 'text-emerald-400' : 'text-rose-400';
        }

        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') {
          input.up = true;
          if (!hero.climbing) triggerJump();
        }
        if (e.code === 'KeyS' || e.code === 'ArrowDown') input.down = true;

        if (e.code === 'Space') {
          if (!input.jumpHeld) triggerJump();
          input.jumpHeld = true;
        }

        // Interaksi Tombol Kitab Rahsia
        if (e.code === 'KeyE') {
          const hMidX = hero.x + hero.w * 0.5;
          const distToTome = Math.abs(hMidX - (secretMechanism.tomeX + secretMechanism.tomeW * 0.5));
          if (distToTome < 75 && Math.abs((hero.y + hero.h) - (secretMechanism.tomeY + 20)) < 40) {
            triggerSecretDoor();
          }
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') input.up = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') input.down = false;
        if (e.code === 'Space') input.jumpHeld = false;
      });

      // ===================================================================
      // 8. UPDATE FIZIK & ANIMASI SLIDING GEAR DROP
      // ===================================================================
      function update(dt) {
        if (camera.shakeFrames > 0) camera.shakeFrames--;

        for (let i = floatingPopups.length - 1; i >= 0; i--) {
          const pop = floatingPopups[i];
          pop.y -= 0.6;
          pop.life--;
          if (pop.life <= 0) floatingPopups.splice(i, 1);
        }

        // ===================================================================
        // LOGIK ANIMASI SLIDING GEAR DROP
        // ===================================================================
        if (secretMechanism.isOpening) {
          // Putaran Gear Mekanikal Berpusing Laju
          secretMechanism.gearRotation += 0.12;

          // Rak Buku Melongsor Turun Menembusi Lantai Sedikit demi Sedikit
          secretMechanism.doorOffsetY += 2.2;

          // Semak jika rak buku dah tenggelam sepenuhnya ke bawah lantai
          if (secretMechanism.doorOffsetY >= secretMechanism.maxDropY) {
            secretMechanism.doorOffsetY = secretMechanism.maxDropY;
            secretMechanism.isOpening = false;
            secretMechanism.isOpen = true;

            // Padamkan sekatan dinding (Wall) supaya hero boleh lalu!
            if (secretMechanism.doorWallRef) {
              secretMechanism.doorWallRef.y = 9999; // Alihkan sekatan jauh ke bawah
            }

            AudioEngine.unlocked();
            addFloatingPopup('PASSAGE TO BELFRY OPENED! ➔', secretMechanism.doorX - 20, 360, '#38bdf8');
          }
        }

        // Pengesanan Dekat Meja Kitab untuk HUD [E]
        const hMidX = hero.x + hero.w * 0.5;
        const distToTome = Math.abs(hMidX - (secretMechanism.tomeX + secretMechanism.tomeW * 0.5));
        const nearTome = distToTome < 75 && Math.abs((hero.y + hero.h) - (secretMechanism.tomeY + 20)) < 40;
        const prompt = document.getElementById('interactPrompt');

        if (nearTome && !secretMechanism.isOpen && !secretMechanism.isOpening) {
          prompt.classList.remove('hidden');
        } else {
          prompt.classList.add('hidden');
        }

        // Pengesanan Tangga
        const hFootY = hero.y + hero.h;
        let nearLadder = null;
        for (const l of ladders) {
          if (hMidX >= l.x - 12 && hMidX <= l.x + l.w + 12 && hFootY >= l.topY - 14 && hero.y <= l.bottomY + 14) {
            nearLadder = l;
            break;
          }
        }

        if (nearLadder && (input.up || input.down)) {
          hero.climbing = true;
          hero.activeLadder = nearLadder;
          hero.vx = 0;
          hero.x = nearLadder.x + (nearLadder.w - hero.w) * 0.5;
        }

        if (hero.climbing) {
          hero.grounded = true;
          hero.vy = 0;
          if (input.up) hero.y -= 3.2;
          else if (input.down) hero.y += 3.2;

          if (hero.y + hero.h < hero.activeLadder.topY - 4) {
            hero.y = hero.activeLadder.topY - hero.h;
            hero.climbing = false;
          } else if (hero.y + hero.h > hero.activeLadder.bottomY) {
            hero.y = hero.activeLadder.bottomY - hero.h;
            hero.climbing = false;
          }
          if (input.left || input.right) hero.climbing = false;
        } else {
          if (input.left) { hero.vx = -hero.speed; hero.facing = -1; }
          else if (input.right) { hero.vx = hero.speed; hero.facing = 1; }
          else { hero.vx *= 0.78; if (Math.abs(hero.vx) < 0.1) hero.vx = 0; }

          if (hero.grounded) hero.coyoteTimer = 7;
          else if (hero.coyoteTimer > 0) hero.coyoteTimer--;

          if (hero.jumpBuffer > 0) hero.jumpBuffer--;
          if (hero.jumpBuffer > 0 && hero.coyoteTimer > 0) {
            hero.vy = -12.4;
            hero.grounded = false;
            hero.coyoteTimer = 0;
            hero.jumpBuffer = 0;
            AudioEngine.jump();
          }

          hero.vy += GRAVITY;
          if (hero.vy > 12) hero.vy = 12;

          const prevFoot = hero.y + hero.h;
          hero.x += hero.vx;

          // ===================================================================
          // SOLID WALL CHECK (SEKATAN PINTU RAHSIABILA BELUM TERBUKA)
          // ===================================================================
          for (const p of platforms) {
            if (p.type === 'wall') {
              if (hero.y + hero.h > p.y && hero.y < p.y + p.h) {
                if (hero.vx > 0 && hero.x + hero.w >= p.x && hero.x < p.x) {
                  hero.x = p.x - hero.w;
                  hero.vx = 0;
                } else if (hero.vx < 0 && hero.x <= p.x + p.w && hero.x + hero.w > p.x + p.w) {
                  hero.x = p.x + p.w;
                  hero.vx = 0;
                }
              }
            }
          }

          hero.y += hero.vy;
          if (hero.x < 20) hero.x = 20;
          if (hero.x > WORLD_W - hero.w - 10) hero.x = WORLD_W - hero.w - 10;

          hero.grounded = false;

          // Platform Lantai Rata
          for (const p of platforms) {
            if (p.type === 'flat') {
              if (hero.x + hero.w > p.x && hero.x < p.x + p.w && hero.vy >= 0) {
                if (prevFoot <= p.y + 14 && hero.y + hero.h >= p.y) {
                  hero.y = p.y - hero.h;
                  hero.vy = 0;
                  hero.grounded = true;
                  break;
                }
              }
            }
          }
        }

        // Keadaan Pose Hero
        if (hero.climbing) hero.state = 'climb';
        else if (!hero.grounded) hero.state = hero.vy < 0 ? 'jump' : 'fall';
        else if (Math.abs(hero.vx) > 0.2) hero.state = 'run';
        else hero.state = 'idle';

        const hAct = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
        if (!hero.climbing || (input.up || input.down)) {
          hero.animTimer += dt;
          if (hero.animTimer >= 1 / hAct.fps) {
            hero.animTimer = 0;
            hero.animFrame++;
            if (hero.animFrame >= hAct.count) hero.animFrame = hAct.loop ? 0 : hAct.count - 1;
          }
        }
      }

      // ===================================================================
      // 9. RENDER LOOP
      // ===================================================================
      function render() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);

        ctx.save();
        let sx = 0, sy = 0;
        if (camera.shakeFrames > 0) {
          sx = (Math.random() - 0.5) * camera.shakeMag * 2;
          sy = (Math.random() - 0.5) * camera.shakeMag * 2;
        }
        ctx.translate(Math.round(sx), Math.round(sy));

        const bg1 = Loaded.get('page1');

        // A. Lukis Latar Belakang Utama Perpustakaan
        if (bg1) {
          ctx.drawImage(bg1, 0, 0, VIEW_W, VIEW_H);
        } else {
          ctx.fillStyle = '#1e1b4b';
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }

        // ===================================================================
        // B. MEKANIK VISUAL SLIDING GEAR DROP PINTU RAHSIAPADA KANVAS
        // ===================================================================
        if (bg1 && secretMechanism.doorOffsetY > 0) {
          const scaleX = bg1.naturalWidth / VIEW_W;
          const scaleY = bg1.naturalHeight / VIEW_H;

          // 1. Lukis Lorong Gelap Purba Di Belakang Pintu (Mendedahkan Jalan Rahsia)
          ctx.save();
          ctx.fillStyle = '#090814';
          ctx.fillRect(secretMechanism.doorX, secretMechanism.doorY, secretMechanism.doorW, secretMechanism.doorH);
          
          // Efek cahaya suar mistik dari bilik rahsia di belakang
          const glow = ctx.createLinearGradient(secretMechanism.doorX, 0, secretMechanism.doorX + secretMechanism.doorW, 0);
          glow.addColorStop(0, 'rgba(147, 51, 234, 0.4)');
          glow.addColorStop(1, 'rgba(0, 0, 0, 0.8)');
          ctx.fillStyle = glow;
          ctx.fillRect(secretMechanism.doorX, secretMechanism.doorY, secretMechanism.doorW, secretMechanism.doorH);
          ctx.restore();

          // 2. Lukis Potongan Rak Buku yang Sedang Melongsor Turun Menembusi Lantai
          ctx.save();
          // Gunakan clipping mask supaya rak buku tenggelam hilang di bawah paras lantai
          ctx.beginPath();
          ctx.rect(secretMechanism.doorX - 10, secretMechanism.doorY, secretMechanism.doorW + 20, secretMechanism.doorH);
          ctx.clip();

          // Anjakkan kedudukan rak ke bawah mengikut doorOffsetY
          ctx.drawImage(
            bg1,
            secretMechanism.doorX * scaleX, secretMechanism.doorY * scaleY,
            secretMechanism.doorW * scaleX, secretMechanism.doorH * scaleY,
            secretMechanism.doorX, secretMechanism.doorY + secretMechanism.doorOffsetY,
            secretMechanism.doorW, secretMechanism.doorH
          );
          ctx.restore();

          // 3. Putaran Roda Gear Mekanikal Berpusing Semasa Pintu Bergerak
          if (secretMechanism.isOpening) {
            ctx.save();
            ctx.translate(secretMechanism.doorX + 80, 480);
            ctx.rotate(secretMechanism.gearRotation);
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 24, 0, Math.PI * 2);
            for (let i = 0; i < 8; i++) {
              const ang = (i / 8) * Math.PI * 2;
              ctx.moveTo(Math.cos(ang) * 18, Math.sin(ang) * 18);
              ctx.lineTo(Math.cos(ang) * 28, Math.sin(ang) * 28);
            }
            ctx.stroke();
            ctx.restore();
          }
        }

        // C. Kilauan Cahaya Emas pada Meja Kitab Rahsia
        if (!secretMechanism.isOpen) {
          const bob = Math.sin(performance.now() * 0.006) * 4;
          ctx.save();
          ctx.fillStyle = 'rgba(251, 191, 36, 0.25)';
          ctx.beginPath();
          ctx.ellipse(secretMechanism.tomeX + 30, secretMechanism.tomeY + 10 + bob, 35, 14, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // D. Lukis Hero Ksatria
        const heroSheet = Loaded.get('hero');
        if (heroSheet) {
          const act = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
          const colsInRow = act.cols || 10;
          const cellW = heroSheet.naturalWidth / colsInRow;
          const cellH = heroSheet.naturalHeight / HERO_CONFIG.rows;
          const srcX = Math.floor((act.startCol + hero.animFrame) * cellW);
          const srcY = Math.floor(act.row * cellH);

          ctx.save();
          ctx.translate(Math.round(hero.x + hero.w * 0.5), Math.round(hero.y + hero.h));
          ctx.scale(hero.facing, 1);
          ctx.drawImage(
            heroSheet,
            srcX, srcY, cellW, cellH,
            HERO_CONFIG.offsetX, HERO_CONFIG.offsetY, HERO_CONFIG.renderSize, HERO_CONFIG.renderSize
          );
          ctx.restore();
        }

        // E. Pop-up Teks Terapung
        floatingPopups.forEach(pop => {
          ctx.save();
          ctx.font = '8px "Press Start 2P"';
          ctx.fillStyle = pop.color;
          ctx.globalAlpha = Math.max(0.1, pop.life / pop.maxLife);
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        });

        // F. Debug Overlay [G]
        if (showDebugRoute) {
          ctx.save();
          ctx.lineWidth = 2;
          ctx.font = '7px "Press Start 2P"';

          // Tangga (Cyan)
          ladders.forEach((l, idx) => {
            ctx.strokeStyle = '#06b6d4';
            ctx.fillStyle = 'rgba(6, 182, 212, 0.25)';
            ctx.strokeRect(l.x, l.topY, l.w, l.bottomY - l.topY);
            ctx.fillRect(l.x, l.topY, l.w, l.bottomY - l.topY);
            ctx.fillStyle = '#22d3ee';
            ctx.fillText(`Ladder ${idx+1}`, l.x - 10, l.topY - 8);
          });

          // Platforms (Hijau) & Dinding Rahsia (Merah)
          platforms.forEach((p, idx) => {
            if (p.type === 'flat') {
              ctx.strokeStyle = '#22c55e';
              ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
              ctx.strokeRect(p.x, p.y, p.w, p.h);
              ctx.fillRect(p.x, p.y, p.w, p.h);
              ctx.fillStyle = '#4ade80';
              ctx.fillText(`[${idx}] ${p.id}`, p.x + 4, p.y - 6);
            } else if (p.type === 'wall' && !secretMechanism.isOpen) {
              ctx.strokeStyle = '#ef4444';
              ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
              ctx.strokeRect(p.x, p.y, p.w, p.h);
              ctx.fillRect(p.x, p.y, p.w, p.h);
              ctx.fillStyle = '#fca5a5';
              ctx.fillText(`LOCKED DOOR WALL`, p.x - 45, p.y - 8);
            }
          });

          // Kawasan Interaksi Meja Kitab (Kuning)
          if (!secretMechanism.isOpen) {
            ctx.strokeStyle = '#facc15';
            ctx.fillStyle = 'rgba(250, 204, 21, 0.25)';
            ctx.strokeRect(secretMechanism.tomeX, secretMechanism.tomeY, secretMechanism.tomeW, secretMechanism.tomeH);
            ctx.fillRect(secretMechanism.tomeX, secretMechanism.tomeY, secretMechanism.tomeW, secretMechanism.tomeH);
            ctx.fillStyle = '#fde047';
            ctx.fillText(`[E] Tome Lever`, secretMechanism.tomeX - 25, secretMechanism.tomeY - 8);
          }

          ctx.restore();
        }

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      Loaded.init(() => {
        requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
</html>
