<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian Pinpoint Pergerakan Hero — AXWORLD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; background: #05070f; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden; }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-2 bg-[#030712]">

  <!-- KOTAK MAKLUMAT STATUS DI ATAS -->
  <div class="mb-2 flex flex-wrap gap-4 text-[9px] bg-slate-900 border border-amber-500/50 px-4 py-2 rounded-xl text-amber-300">
    <div>STATUS: <span id="txtState" class="text-cyan-300">idle</span></div>
    <div>FRAME: <span id="txtFrame" class="text-white">0</span></div>
    <div>POSISI: X=<span id="txtX" class="text-white">0</span>, Y=<span id="txtY" class="text-white">0</span></div>
    <div>GROUNDED: <span id="txtGrounded" class="text-emerald-400">YA</span></div>
  </div>

  <div class="relative w-full max-w-[960px] aspect-video rounded-xl overflow-hidden border-2 border-amber-500/50 shadow-2xl bg-[#0a0f1d]">
    <canvas id="testCanvas" width="960" height="540" class="w-full h-full block"></canvas>
  </div>

  <!-- PANDUAN KAWALAN -->
  <div class="mt-2 text-center text-[8px] text-slate-400 leading-relaxed">
    [A / D / ◄ / ►] Bergerak | [W / Space / ▲] Lompat | [J] Tebasan Biasa | [C] Panjat Tangga | [V] Gaya Menang | [H] Terkena Serangan
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('testCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const W = 960;
      const H = 540;

      // ========================================================
      // 1. PEMUATAN IMEJ SPRITE HERO
      // ========================================================
      const heroImg = new Image();
      heroImg.src = 'hero_azzumie_spritesheet.png';
      heroImg.onerror = () => { heroImg.src = 'hero_azzumie_spritesheet_3.jpg'; };

      // ========================================================
      // 2. PINPOINT PRESI MUKTAMAD (TEPAT MENGIKUT SETIAP BARIS)
      // ========================================================
      const HERO_CONFIG = {
        rows: 5,
        renderSize: 120, // Saiz visual atas kanvas
        offsetX: -60,    // Paksi tengah tubuh
        offsetY: -96,    // Dilaraskan tepat atas garisan pelantar
        actions: {
          // Baris 0: Idle (10 lajur, 5 bingkai pertama hadap kanan)
          idle:        { row: 0, cols: 10, startCol: 0, count: 5, fps: 6,  loop: true },

          // Baris 1: Run (8 lajur, 8 bingkai larian lengkap)
          run:         { row: 1, cols: 8,  startCol: 0, count: 6, fps: 14, loop: true },

          // Baris 2: Jump & Fall (10 lajur, Kolum 2 = Naik, Kolum 3 = Junam)
          jump:        { row: 2, cols: 10, startCol: 2, count: 1, fps: 1,  loop: false },
          fall:        { row: 2, cols: 10, startCol: 3, count: 1, fps: 1,  loop: false },

          // Baris 2: Panjat Tangga (10 lajur, Kolum 6 hingga 9)
          climb:       { row: 0, cols: 10, startCol: 7, count: 3, fps: 7,  loop: true },

          // Baris 3: Serangan Biasa (12 lajur, Kolum 0 hingga 4)
          slash:       { row: 3, cols: 9, startCol: 0, count: 6, fps: 17, loop: false },

          // Baris 4: Gaya Menang (12 lajur, Kolum 0 hingga 3)
          victory:     { row: 4, cols: 8, startCol: 0, count: 2, fps: 6,  loop: true },

          // Baris 4: Cedera / Rebah (12 lajur, Kolum 7 hingga 10)
          hurt:        { row: 4, cols: 9, startCol: 5, count: 4, fps: 8,  loop: false }
        }
      };

      // ========================================================
      // 3. ENTITI HERO & PELANTAR UJIAN
      // ========================================================
      const hero = {
        x: 440,
        y: 280,
        w: 48,
        h: 76,
        vx: 0,
        vy: 0,
        speed: 4.5,
        facing: 1,
        grounded: false,
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        actionLock: false
      };

      const testPlatforms = [
        { x: 60,  y: 420, w: 840, h: 40, label: "Lantai Utama" },
        { x: 180, y: 310, w: 160, h: 20, label: "Pelantar Rendah" },
        { x: 620, y: 310, w: 160, h: 20, label: "Pelantar Rendah" },
        { x: 380, y: 220, w: 200, h: 20, label: "Pelantar Tinggi" }
      ];

      // Kawalan Input
      const keys = { left: false, right: false };

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
        if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
          if (hero.grounded && !hero.actionLock) {
            hero.vy = -12.5;
            hero.grounded = false;
          }
        }
        if (e.code === 'KeyJ') triggerAction('slash');
        if (e.code === 'KeyC') triggerAction('climb');
        if (e.code === 'KeyV') triggerAction('victory');
        if (e.code === 'KeyH') triggerAction('hurt');
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      });

      function triggerAction(actionName) {
        if (hero.actionLock) return;
        hero.actionLock = true;
        hero.state = actionName;
        hero.animFrame = 0;
        hero.animTimer = 0;
      }

      // ========================================================
      // 4. LOGIK FIZIK & ANIMASI (BEBAS RALAT & STABIL)
      // ========================================================
      let lastT = performance.now();

      function update(dt) {
        // Kawalan Pergerakan
        if (!hero.actionLock) {
          if (keys.left) {
            hero.vx = -hero.speed;
            hero.facing = -1;
          } else if (keys.right) {
            hero.vx = hero.speed;
            hero.facing = 1;
          } else {
            hero.vx *= 0.78;
            if (Math.abs(hero.vx) < 0.1) hero.vx = 0;
          }
        } else {
          hero.vx *= 0.82;
        }

        // Graviti & Pergerakan Fizik
        hero.vy += 0.52;
        if (hero.vy > 12) hero.vy = 12;

        const prevFoot = hero.y + hero.h;
        hero.x += hero.vx;
        hero.y += hero.vy;

        // Had Sempadan
        if (hero.x < 20) hero.x = 20;
        if (hero.x > W - hero.w - 20) hero.x = W - hero.w - 20;

        // Pijakan Pelantar
        hero.grounded = false;
        for (const p of testPlatforms) {
          if (hero.x + hero.w > p.x && hero.x < p.x + p.w && hero.vy >= 0) {
            if (prevFoot <= p.y + 12 && hero.y + hero.h >= p.y) {
              hero.y = p.y - hero.h;
              hero.vy = 0;
              hero.grounded = true;
              break;
            }
          }
        }

        // Penentuan Status Berperingkat (Anti-Glitch)
        if (!hero.actionLock) {
          if (!hero.grounded) {
            const airState = hero.vy < 0 ? 'jump' : 'fall';
            if (hero.state !== airState) {
              hero.state = airState;
              hero.animFrame = 0;
              hero.animTimer = 0;
            }
          } else if (Math.abs(hero.vx) > 0.2) {
            if (hero.state !== 'run') {
              hero.state = 'run';
              hero.animFrame = 0;
              hero.animTimer = 0;
            }
          } else {
            if (hero.state !== 'idle') {
              hero.state = 'idle';
              hero.animFrame = 0;
              hero.animTimer = 0;
            }
          }
        }

        // Kemas Kini Bingkai
        const act = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
        hero.animTimer += dt;
        if (hero.animTimer >= 1 / act.fps) {
          hero.animTimer = 0;
          hero.animFrame++;
          if (hero.animFrame >= act.count) {
            if (act.loop) {
              hero.animFrame = 0;
            } else {
              hero.animFrame = act.count - 1; // Kunci pada bingkai akhir
              if (hero.actionLock) {
                hero.actionLock = false;
                hero.state = hero.grounded ? 'idle' : 'fall';
                hero.animFrame = 0;
              }
            }
          }
        }

        // Had keselamatan bingkai
        if (hero.animFrame >= act.count) {
          hero.animFrame = act.count - 1;
        }

        // Kemas kini UI Status
        document.getElementById('txtState').textContent = hero.state;
        document.getElementById('txtFrame').textContent = hero.animFrame;
        document.getElementById('txtX').textContent = Math.round(hero.x);
        document.getElementById('txtY').textContent = Math.round(hero.y);
        document.getElementById('txtGrounded').textContent = hero.grounded ? "YA" : "TIDAK";
      }

      // ========================================================
      // 5. LUKISAN PADA KANVAS
      // ========================================================
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Grid Panduan
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Pelantar Ujian
        testPlatforms.forEach(p => {
          ctx.fillStyle = '#1e293b';
          ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = '#4ade80';
          ctx.fillRect(p.x, p.y, p.w, 4);

          ctx.fillStyle = '#64748b';
          ctx.font = '6px "Press Start 2P"';
          ctx.fillText(p.label, p.x + 8, p.y + 14);
        });

        // Hitbox Hijau
        ctx.strokeStyle = 'rgba(74, 222, 128, 0.4)';
        ctx.strokeRect(hero.x, hero.y, hero.w, hero.h);

        // Lukisan Sprite Hero Tepat
        if (heroImg.complete && heroImg.naturalWidth > 0) {
          const act = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
          const colsInRow = act.cols || 10;
          const cellW = heroImg.naturalWidth / colsInRow;
          const cellH = heroImg.naturalHeight / HERO_CONFIG.rows;

          const sx = Math.floor((act.startCol + hero.animFrame) * cellW);
          const sy = Math.floor(act.row * cellH);

          const cx = Math.round(hero.x + hero.w * 0.5);
          const footY = Math.round(hero.y + hero.h);

          ctx.save();
          ctx.translate(cx, footY);
          ctx.scale(hero.facing, 1);

          ctx.drawImage(
            heroImg,
            sx, sy, cellW, cellH,
            HERO_CONFIG.offsetX, HERO_CONFIG.offsetY, HERO_CONFIG.renderSize, HERO_CONFIG.renderSize
          );
          ctx.restore();
        } else {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(hero.x, hero.y, hero.w, hero.h);
        }
      }

      function loop(now) {
        const dt = (now - lastT) / 1000;
        lastT = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
