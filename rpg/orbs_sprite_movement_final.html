<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>5 Power Orbs — Stabil & Tanpa Bayangan Ganda</title>
  <style>
    body {
      margin: 0;
      background: #060913;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #f8fafc;
      font-family: monospace;
    }
    canvas {
      background: #080c18;
      border: 2px solid #f59e0b;
      image-rendering: pixelated;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>

  <h2 style="color: #fbbf24; margin-bottom: 20px;">5 POWER ORBS (STABIL & ANIMASI HALUS)</h2>
  <canvas id="orbCanvas" width="800" height="240"></canvas>

  <script>
    const cvs = document.getElementById('orbCanvas');
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const orbImg = new Image();
    orbImg.src = 'power_orbs_spritesheet.png';

    const COLS = 7;
    const ROWS = 5;

    let frameW = 0;
    let frameH = 0;

    orbImg.onload = () => {
      frameW = Math.floor(orbImg.naturalWidth / COLS);
      frameH = Math.floor(orbImg.naturalHeight / ROWS);
    };

    // Gunakan variasi frame 1 sampai 3 bolak-balik agar elemen api/petir bergerak tanpa melompat jauh
    const FRAMES = [1, 2, 3, 4, 5, 6, 2];
    let frameIdx = 0;
    let timer = 0;
    const FPS = 6; // Kecepatan pergantian bingkai lebih tenang
    let lastTime = performance.now();

    function loop(t) {
      const dt = (t - lastTime) / 1000;
      lastTime = t;

      ctx.clearRect(0, 0, cvs.width, cvs.height);

      if (frameW > 0 && frameH > 0) {
        timer += dt;
        if (timer >= 1 / FPS) {
          timer = 0;
          frameIdx = (frameIdx + 1) % FRAMES.length;
        }

        const activeCol = FRAMES[frameIdx];

        for (let row = 0; row < ROWS; row++) {
          const posX = 50 + row * 140;
          
          // Efek mengapung lembut (vertikal saja, tanpa geser horizontal)
          const bobY = Math.sin((t / 400) + (row * 1.3)) * 5;
          const posY = 85 + bobY;

          // Beri batas inset 3px ke dalam agar sama sekali tidak menyentuh frame sebelah
          const PADDING_X = 4;
          const PADDING_Y = 2;

          const sx = (activeCol * frameW) + PADDING_X;
          const sy = (row * frameH) + PADDING_Y;
          const sw = frameW - (PADDING_X * 2);
          const sh = frameH - (PADDING_Y * 2);

          const renderSize = 70;

          // Gambar frame sprite asli dari berkas
          ctx.drawImage(
            orbImg,
            sx, sy, sw, sh,
            posX, posY, renderSize, renderSize
          );
        }
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
