<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian Gelombang Api Bos — AXWORLD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; background: #05070f; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden; }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-2 bg-[#030712]">

  <!-- KOTAK MAKLUMAT STATUS DI ATAS -->
  <div class="mb-2 flex flex-wrap gap-4 text-[9px] bg-slate-900 border border-amber-500/50 px-4 py-2 rounded-xl text-amber-300">
    <div>JUMLAH OMBAK: <span id="txtCount" class="text-white">0</span></div>
    <div>KELAJUAN MARA: <span class="text-cyan-400">5.5 px/frame</span></div>
    <div>PANDUAN: <span class="text-emerald-400">Tekan SPACE untuk Hentak Api</span></div>
  </div>

  <div class="relative w-full max-w-[960px] aspect-video rounded-xl overflow-hidden border-2 border-amber-500/50 shadow-2xl bg-[#0a0f1d]">
    <canvas id="testCanvas" width="960" height="540" class="w-full h-full block"></canvas>
  </div>

  <!-- PANDUAN KAWALAN -->
  <div class="mt-2 text-center text-[8px] text-slate-400 leading-relaxed">
    [SPACE / J] Tembak Ombak Api ke Kiri | [K] Tembak Ombak Api ke Kanan | [R] Padam Semua
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('testCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const W = 960;
      const H = 540;

      // ========================================================
      // 1. PEMUATAN IMEJ SPRITE SHOCKWAVE API
      // ========================================================
      const fireImg = new Image();
      fireImg.src = 'boss_shockwave_spritesheet.png';

      const COLS = 6;
      const ROWS = 1;

      // ========================================================
      // 2. SENARAI ENTITI GELOMBANG API
      // ========================================================
      let shockwaves = [];
      const testFloorY = 380; // Paras garisan lantai

      function spawnShockwave(dir = -1) {
        // Punca letupan di tengah skrin (tempat kapak hentak)
        const startX = dir === -1 ? 650 : 310;
        shockwaves.push({
          x: startX,
          y: testFloorY,
          vx: dir * 5.5,
          facing: dir,
          frame: 0,
          timer: 0,
          fps: 10,       // Kelajuan animasi api
          alive: true
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'KeyJ') {
          spawnShockwave(-1); // Mara ke kiri (arah hero)
        }
        if (e.code === 'KeyK') {
          spawnShockwave(1);  // Mara ke kanan
        }
        if (e.code === 'KeyR') {
          shockwaves = [];
        }
      });

      // ========================================================
      // 3. KEMAS KINI FIZIK & ANIMASI
      // ========================================================
      let lastT = performance.now();

      function update(dt) {
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.x += sw.vx;

          sw.timer += dt;
          if (sw.timer >= 1 / sw.fps) {
            sw.timer = 0;
            sw.frame++;
            if (sw.frame >= COLS) {
              sw.alive = false; // Tamat kitaran 6 bingkai
            }
          }

          // Padam jika dah mati atau keluar skrin
          if (!sw.alive || sw.x < -100 || sw.x > W + 100) {
            shockwaves.splice(i, 1);
          }
        }

        document.getElementById('txtCount').textContent = shockwaves.length;
      }

      // ========================================================
      // 4. LUKISAN PADA KANVAS
      // ========================================================
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Grid Panduan
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Garisan Lantai Altar (Hijau Neon)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(80, testFloorY, 800, 40);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(80, testFloorY, 800, 4);

        // Mockup Tempat Hentakan Kapak Bos
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(630, testFloorY - 140, 40, 140);
        ctx.fillStyle = '#fde047';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText("BOS", 635, testFloorY - 150);

        // Lukis Setiap Gelombang Api
        if (fireImg.complete && fireImg.naturalWidth > 0) {
          const cellW = fireImg.naturalWidth / COLS;
          const cellH = fireImg.naturalHeight / ROWS;

          // Saiz paparan visual yang seimbang dengan lantai
          const renderH = 95;
          const aspect = cellW / cellH;
          const renderW = Math.round(renderH * aspect);

          shockwaves.forEach(sw => {
            ctx.save();
            ctx.translate(Math.round(sw.x), sw.y);
            ctx.scale(sw.facing, 1); // Pusingkan arah ombak mara

            // Sedikit pendaran cahaya magma oren di lantai
            const glowGrad = ctx.createRadialGradient(0, -6, 2, 0, -6, 40);
            glowGrad.addColorStop(0, 'rgba(251, 146, 60, 0.55)');
            glowGrad.addColorStop(0.6, 'rgba(239, 68, 68, 0.25)');
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.ellipse(0, -4, 45, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Lukis sprite api dari fail gambar (Ditenggelamkan ke paras lantai)
            const sx = Math.floor(sw.frame * cellW);
            const offsetY = -renderH + 17; // <-- Laraskan nombor +22 ini untuk turunkan api

            ctx.drawImage(
              fireImg,
              sx, 0, cellW, cellH,
              -Math.round(renderW * 0.5), offsetY, renderW, renderH
            );

            ctx.restore();
          });
        }
      }

      function loop(now) {
        const dt = (now - lastT) / 1000;
        lastT = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
