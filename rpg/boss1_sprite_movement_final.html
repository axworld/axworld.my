<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ujian Pinpoint Pergerakan Bos 1 (Protocol Leviathan) — AXWORLD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; }
    body { margin: 0; background: #05070f; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center p-2 bg-[#030712]">

  <!-- KOTAK MAKLUMAT STATUS DI ATAS -->
  <div class="mb-2 flex flex-wrap gap-4 text-[9px] bg-slate-900 border border-red-500/50 px-4 py-2 rounded-xl text-red-300">
    <div>BOS STATUS: <span id="txtState" class="text-amber-300">idle</span></div>
    <div>FRAME: <span id="txtFrame" class="text-white">0</span></div>
    <div>POSISI: X=<span id="txtX" class="text-white">0</span>, Y=<span id="txtY" class="text-white">0</span></div>
    <div>ARAH: <span id="txtFacing" class="text-cyan-400">KIRI</span></div>
  </div>

  <div class="relative w-full max-w-[960px] aspect-video rounded-xl overflow-hidden border-2 border-red-500/50 shadow-2xl bg-[#0a0f1d]">
    <canvas id="testCanvas" width="960" height="540" class="w-full h-full block"></canvas>
  </div>

  <!-- PANDUAN BUTANG UJIAN -->
  <div class="mt-2 text-center text-[8px] text-slate-400 leading-relaxed">
    [1] Idle | [2] Angkat Kapak (Windup) | [3] Hentakan Bumi (Slam) | [4] Kalah & Hancur (Defeat) | [A / D] Pusing Kiri / Kanan | [R] Reset Bos
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('testCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const W = 960;
      const H = 540;

      // ========================================================
      // 1. PEMUATAN IMEJ SPRITE BOS
      // ========================================================
      const bossImg = new Image();
      bossImg.src = 'boss1_spritesheet.png';
      bossImg.onerror = () => { bossImg.src = 'boss1_spritesheet_3.jpg'; };

      // ========================================================
      // 2. PINPOINT PRESI PROTOCOL LEVIATHAN (GRID 6x4)
      // ========================================================
      const BOSS_CONFIG = {
        rows: 4,
        cols: 6,
        renderSize: 200, // Saiz gergasi megah bertaraf bos
        offsetX: -100,   // Paksi tengah badan tepat
        offsetY: -190,   // Kaki mencecah lantai pelantar
        actions: {
          // Baris 0: Idle (6 bingkai bernafas bergelora)
          idle:   { row: 0, startCol: 0, count: 4, fps: 6, loop: true },

          // Baris 1: Angkat Kapak Berapi (6 bingkai)
          windup: { row: 1, startCol: 0, count: 5, fps: 7, loop: false },

          // Baris 2: Hentak Kapak & Letupan Bumi (6 bingkai)
          slam:   { row: 2, startCol: 0, count: 5, fps: 8, loop: false },

          // Baris 3: Tumpas & Jadi Zarah Cahaya (6 bingkai)
          defeat: { row: 3, startCol: 0, count: 6, fps: 6, loop: false }
        }
      };

      // ========================================================
      // 3. ENTITI BOS & PELANTAR UJIAN
      // ========================================================
      const boss = {
        x: 480,
        y: 220,
        w: 90,
        h: 140,
        facing: -1, // Menghadap kiri secara lalai (ke arah hero datang)
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        actionLock: false,
        alive: true
      };

      const testFloor = { x: 80, y: 395, w: 800, h: 40 };
      let screenShake = 0;
      let shockwaves = [];

      // Kawalan Papan Kekunci Ujian
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Digit1') triggerBossState('idle');
        if (e.code === 'Digit2') triggerBossState('windup');
        if (e.code === 'Digit3') triggerBossState('slam');
        if (e.code === 'Digit4') triggerBossState('defeat');

        if (e.code === 'KeyA') boss.facing = -1; // Pandang Kiri
        if (e.code === 'KeyD') boss.facing = 1;  // Pandang Kanan

        if (e.code === 'KeyR') {
          boss.x = 480;
          boss.facing = -1;
          boss.alive = true;
          shockwaves = [];
          triggerBossState('idle');
        }
      });

      function triggerBossState(stateName) {
        boss.state = stateName;
        boss.animFrame = 0;
        boss.animTimer = 0;
        boss.actionLock = (stateName === 'windup' || stateName === 'slam' || stateName === 'defeat');
      }

      // ========================================================
      // 4. LOGIK KEMAS KINI
      // ========================================================
      let lastT = performance.now();

      function update(dt) {
        if (screenShake > 0) screenShake--;

        // Tapak kaki di atas pelantar
        boss.y = testFloor.y - boss.h;

        // Gelombang hentakan tanah
        shockwaves.forEach(sw => {
          sw.x += sw.vx;
          sw.life--;
        });
        shockwaves = shockwaves.filter(sw => sw.life > 0);

        if (!boss.alive) return;

        // Pengiraan Bingkai Animasi
        const act = BOSS_CONFIG.actions[boss.state] || BOSS_CONFIG.actions.idle;
        boss.animTimer += dt;
        if (boss.animTimer >= 1 / act.fps) {
          boss.animTimer = 0;
          boss.animFrame++;

          // Impak hentakan kapak cecah tanah pada Frame 3 Baris 2
          if (boss.state === 'slam' && boss.animFrame === 3) {
            screenShake = 16;
            shockwaves.push({ x: boss.x + (boss.facing === 1 ? 50 : -50), y: testFloor.y, vx: boss.facing * 6.5, life: 60 });
          }

          if (boss.animFrame >= act.count) {
            if (act.loop) {
              boss.animFrame = 0;
            } else {
              boss.animFrame = act.count - 1;
              if (boss.state === 'windup') {
                // Selepas angkat kapak, terus hayun hentak
                triggerBossState('slam');
              } else if (boss.state === 'slam') {
                boss.actionLock = false;
                boss.state = 'idle';
                boss.animFrame = 0;
              } else if (boss.state === 'defeat') {
                boss.alive = false;
              }
            }
          }
        }

        // Kemas kini UI status
        document.getElementById('txtState').textContent = boss.state;
        document.getElementById('txtFrame').textContent = boss.animFrame;
        document.getElementById('txtX').textContent = Math.round(boss.x);
        document.getElementById('txtY').textContent = Math.round(boss.y);
        document.getElementById('txtFacing').textContent = boss.facing === 1 ? "KANAN" : "KIRI";
      }

      // ========================================================
      // 5. LUKISAN PADA KANVAS
      // ========================================================
      function draw() {
        ctx.save();
        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }
        ctx.clearRect(-20, -20, W + 40, H + 40);

        // Grid Panduan
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += 40) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        }

        // Pelantar Ujian (Altar Batu)
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(testFloor.x, testFloor.y, testFloor.w, testFloor.h);
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(testFloor.x, testFloor.y, testFloor.w, 4);

        // Hitbox Merah Bos
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
        ctx.strokeRect(boss.x - boss.w * 0.5, boss.y, boss.w, boss.h);

        // Gelombang Letupan Tanah
        shockwaves.forEach(sw => {
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(sw.x, sw.y - 12, 14, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(sw.x, sw.y - 16, 8, 0, Math.PI * 2);
          ctx.fill();
        });

        // Lukisan Sprite Bos
        if (bossImg.complete && bossImg.naturalWidth > 0) {
          const cellW = bossImg.naturalWidth / BOSS_CONFIG.cols;
          const cellH = bossImg.naturalHeight / BOSS_CONFIG.rows;

          const act = BOSS_CONFIG.actions[boss.state] || BOSS_CONFIG.actions.idle;
          const sx = Math.floor((act.startCol + boss.animFrame) * cellW);
          const sy = Math.floor(act.row * cellH);

          const cx = Math.round(boss.x);
          const footY = Math.round(testFloor.y);

          ctx.save();
          ctx.translate(cx, footY);

          // Pusingan Arah Sprite:
          // Sprite asal melukis bos menghadap ke KANAN.
          // Jadi jika facing == -1 (pandang kiri), kita scale(-1, 1).
          // Jika facing == 1 (pandang kanan), scale(1, 1).
          ctx.scale(-boss.facing, 1);

          ctx.drawImage(
            bossImg,
            sx, sy, cellW, cellH,
            BOSS_CONFIG.offsetX, BOSS_CONFIG.offsetY, BOSS_CONFIG.renderSize, BOSS_CONFIG.renderSize
          );
          ctx.restore();
        } else {
          ctx.fillStyle = '#991b1b';
          ctx.fillRect(boss.x - 45, boss.y, 90, 140);
        }

        ctx.restore(); // Tutup Screen Shake
      }

      function loop(now) {
        const dt = (now - lastT) / 1000;
        lastT = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
