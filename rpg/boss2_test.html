<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STAGE 2 — BOSS & HERO SPRITE TESTBENCH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #030712; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden;
    }
    #gameCanvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud-glass {
      background: rgba(10, 16, 31, 0.90);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }
    .test-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #fde047;
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .test-btn:hover { background: #d97706; color: #000; }
  </style>
</head>
<body class="w-full h-full flex flex-col items-center justify-center bg-[#030712]">

  <div id="canvasFrame" class="relative w-full max-w-[1280px] aspect-video flex items-center justify-center overflow-hidden border-2 border-amber-500/40 rounded-xl bg-slate-950 shadow-2xl">
    <canvas id="gameCanvas" width="960" height="540" class="w-full h-full block"></canvas>

    <!-- STATUS BAR ATAS -->
    <div class="pointer-events-none absolute top-3 inset-x-3 flex justify-between items-center z-20">
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-amber-300">
        STAGE 2 TESTBENCH: MAGMA WARDEN, WALLS &amp; CLIMB ENGINE
      </div>
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-cyan-300">
        DEBUG OVERLAY [G]: <span id="debugStatus" class="text-emerald-400">ON</span>
      </div>
    </div>

    <!-- PANEL KAWALAN UJIAN SPRITE DI BAWAH -->
    <div class="absolute bottom-3 inset-x-3 flex flex-wrap justify-center items-center gap-2 z-20 bg-black/80 p-2 rounded-xl border border-slate-700">
      <span class="text-[7px] text-slate-400 mr-2">BOSS ACTIONS:</span>
      <button class="test-btn" onclick="forceBossAction('idle')">Idle</button>
      <button class="test-btn" onclick="forceBossAction('breathe')">Fire Breath</button>
      <button class="test-btn" onclick="forceBossAction('summon')">Summon Pillars</button>
      <button class="test-btn" onclick="forceBossAction('defeat')">Defeat</button>
      <button class="test-btn bg-rose-950 text-rose-300 border-rose-500" onclick="spawnTestFireball()">Shoot Fireball</button>
      <button class="test-btn bg-amber-950 text-amber-300 border-amber-500" onclick="spawnTestPillar()">Summon Pillar</button>
      <button class="test-btn bg-cyan-950 text-cyan-300 border-cyan-500" onclick="teleportHero('ladder')">TP to Ladder</button>
      <button class="test-btn bg-purple-950 text-purple-300 border-purple-500" onclick="teleportHero('bridge')">TP to Boss</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ===================================================================
      // 1. SMART ASSETS LOADER
      // ===================================================================
      const CANDIDATES = {
        hero: ["hero_azzumie_spritesheet.png", "hero_azzumie_spritesheet_3.jpg"],
        boss2: ["boss2_spritesheet.jpg", "boss2_spritesheet.png"],
        fireball: ["fireball_sprite.png", "fireball_sprite.jpg"],
        pillar: ["larva_pillar_sprite.jpg", "larva_pillar_sprite.png"],
        page1: ["stage2_bg_page1.jpg", "stage2_bg_page1_2.jpg"],
        page2: ["stage2_bg_page2_2.jpg", "stage2_bg_page2.jpg"]
      };

      const Loaded = {
        images: {},
        init(onComplete) {
          const keys = Object.keys(CANDIDATES);
          let count = 0;
          let completed = false;

          const doneCheck = () => {
            if (!completed) {
              completed = true;
              onComplete();
            }
          };

          setTimeout(doneCheck, 2000);

          keys.forEach((k) => {
            const list = CANDIDATES[k];
            let idx = 0;
            const tryNext = () => {
              if (idx >= list.length) {
                count++;
                if (count === keys.length) doneCheck();
                return;
              }
              const src = list[idx++];
              const img = new Image();
              img.onload = () => {
                Loaded.images[k] = img;
                count++;
                if (count === keys.length) doneCheck();
              };
              img.onerror = () => tryNext();
              img.src = src;
            };
            tryNext();
          });
        },
        get(k) {
          const img = this.images[k];
          return (img && img.complete && img.naturalWidth > 0) ? img : null;
        }
      };

      // ===================================================================
      // 2. CANVAS & CAMERA
      // ===================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const VIEW_W = 960;
      const VIEW_H = 540;
      const WORLD_W = 1920;
      const GRAVITY = 0.52;

      const camera = { x: 0, targetX: 0, shakeFrames: 0, shakeMag: 0 };
      let showDebugRoute = true;

      // ===================================================================
      // 3. PLATFORMS, WALLS & LADDERS (UPDATED WITH P1_WALL)
      // ===================================================================
      const platforms = [
        // Page 1: Gua
        { id: 'p1_ground', type: 'flat', x: 0, y: 470, w: 900, h: 90 },
        { id: 'p1_plank_left', type: 'flat', x: 90, y: 310, w: 170, h: 18 },
        { id: 'p1_cross_beam', type: 'flat', x: 400, y: 240, w: 100, h: 16 },
        { id: 'p1_stone_ledge', type: 'flat', x: 500, y: 210, w: 80, h: 20 },
        { id: 'p2_stone_ledge', type: 'flat', x: 580, y: 180, w: 130, h: 20 },
        { id: 'p1_exit_plank', type: 'flat', x: 710, y: 300, w: 115, h: 16 },
	{ id: 'p1_connect_ramp', type: 'ramp', x1: 240, y1: 310, x2: 400, y2: 240 },

        // SOLID WALL: Menghalang pergerakan paksi-X (X: 580, Y: 310)
        { id: 'p1_wall', type: 'wall', x: 500, y: 210, w: 10, h: 50 },
        { id: 'p1_wall', type: 'wall', x: 580, y: 180, w: 10, h: 50 },

        // Page 2: Lahar
        { id: 'p2_connect_ramp', type: 'ramp', x1: 900, y1: 470, x2: 1040, y2: 430 },
        { id: 'p2_lava_bridge', type: 'flat', x: 1040, y: 430, w: 590, h: 130 },
        { id: 'p2_stepping_a', type: 'flat', x: 1170, y: 280, w: 100, h: 18 },
        { id: 'p2_stepping_b', type: 'flat', x: 1300, y: 270, w: 70, h: 18 },
        { id: 'p2_stepping_c', type: 'flat', x: 1380, y: 240, w: 70, h: 18 },
        { id: 'p2_stepping_top', type: 'flat', x: 1530, y: 170, w: 120, h: 20 },
        { id: 'p2_throne_ramp', type: 'ramp', x1: 1630, y1: 430, x2: 1800, y2: 250 },
        { id: 'p2_altar_throne', type: 'flat', x: 1800, y: 250, w: 130, h: 290 }
      ];

      const ladders = [
        { id: 'ladder_1', x: 100, w: 34, topY: 310, bottomY: 470 },
        { id: 'ladder_2', x: 675, w: 38, topY: 180, bottomY: 470 }
      ];

      const pillars = [
        { id: 'p1_center_stalactite', x: 290, y: 210, w: 110, h: 100, alpha: 0.88 },
        { id: 'p2_center_stalactite', x: 310, y: 400, w: 80, h: 90, alpha: 0.88 },
        { id: 'p3_center_stalactite', x: 340, y: 20, w: 30, h: 500, alpha: 0.88 },
        { id: 'p4_center_stalactite', x: 260, y: 270, w: 130, h: 40, alpha: 0.88 },
        { id: 'p5_center_stalactite', x: 340, y: 20, w: 60, h: 90, alpha: 0.88 },
        { id: 'p1_right_exit_wall', x: 920, y: 350, w: 80, h: 180, alpha: 0.88 }
      ];

      // ===================================================================
      // 4. CONFIGURATIONS (HERO & BOSS 2)
      // ===================================================================
      const HERO_CONFIG = {
        rows: 5,
        renderSize: 120,
        offsetX: -60,
        offsetY: -100,
        actions: {
          idle:    { row: 0, cols: 10, startCol: 0, count: 5, fps: 6,  loop: true },
          run:     { row: 1, cols: 8,  startCol: 0, count: 6, fps: 14, loop: true },
          jump:    { row: 2, cols: 10, startCol: 2, count: 1, fps: 1,  loop: false },
          fall:    { row: 2, cols: 10, startCol: 3, count: 1, fps: 1,  loop: false },
          climb:   { row: 1, cols: 8,  startCol: 1, count: 4, fps: 8,  loop: true },
          slash:   { row: 3, cols: 9,  startCol: 0, count: 6, fps: 17, loop: false }
        }
      };

      const BOSS2_CONFIG = {
        rows: 4,
        cols: 7,
        renderSize: 190,
        offsetX: -95,
        offsetY: -190,
        actions: {
          idle:     { row: 0, startCol: 0, count: 4, fps: 5, loop: true },
          breathe:  { row: 1, startCol: 0, count: 4, fps: 6, loop: false },
          summon:   { row: 2, startCol: 0, count: 4, fps: 6, loop: false },
          defeat:   { row: 3, startCol: 0, count: 6, fps: 5, loop: false }
        }
      };

      // ===================================================================
      // 5. ENTITIES
      // ===================================================================
      const hero = {
        x: 60,
        y: 370,
        w: 48,
        h: 76,
        vx: 0,
        vy: 0,
        speed: 4.5,
        facing: 1,
        hp: 100,
        grounded: false,
        climbing: false,
        activeLadder: null,
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        actionLock: false,
        invulnFrames: 0,
        coyoteTimer: 0,
        jumpBuffer: 0
      };

      const boss = {
        x: 1480,
        y: 430,
        w: 100,
        h: 150,
        facing: -1,
        hp: 450,
        state: 'idle',
        animFrame: 0,
        animTimer: 0
      };

      let fireballs = [];
      let lavaPillars = [];

      // ===================================================================
      // 6. INPUT CONTROLLER
      // ===================================================================
      const input = { left: false, right: false, up: false, down: false, jumpPressed: false, jumpHeld: false };

      function triggerJump() {
        input.jumpPressed = true;
        input.jumpHeld = true;
        hero.jumpBuffer = 8;
        if (hero.climbing) {
          hero.climbing = false;
          hero.vy = -10.5;
        }
      }

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        
        if (e.code === 'KeyG') {
          showDebugRoute = !showDebugRoute;
          const status = document.getElementById('debugStatus');
          status.textContent = showDebugRoute ? 'ON' : 'OFF';
          status.className = showDebugRoute ? 'text-emerald-400' : 'text-rose-400';
        }

        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
        
        if (e.code === 'KeyW' || e.code === 'ArrowUp') {
          input.up = true;
          if (!hero.climbing) triggerJump();
        }
        if (e.code === 'KeyS' || e.code === 'ArrowDown') input.down = true;

        if (e.code === 'Space') {
          if (!input.jumpHeld) triggerJump();
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
        if (e.code === 'KeyW' || e.code === 'ArrowUp') input.up = false;
        if (e.code === 'KeyS' || e.code === 'ArrowDown') input.down = false;
        if (e.code === 'Space') input.jumpHeld = false;
      });

      // ===================================================================
      // 7. TEST CONTROLS
      // ===================================================================
      window.forceBossAction = function(actionName) {
        if (!BOSS2_CONFIG.actions[actionName]) return;
        boss.state = actionName;
        boss.animFrame = 0;
        boss.animTimer = 0;
      };

      window.spawnTestFireball = function() {
        fireballs.push({
          x: boss.x + (boss.facing === -1 ? -45 : 45),
          y: boss.y - 80,
          vx: boss.facing * 5.8,
          frame: 0,
          animTimer: 0
        });
      };

      window.spawnTestPillar = function() {
        lavaPillars.push({
          x: hero.x + hero.w * 0.5,
          y: 430,
          stage: 'warning',
          warningTimer: 0.75,
          frame: 0,
          animTimer: 0
        });
      };

      window.teleportHero = function(target) {
        if (target === 'ladder') {
          hero.x = 95;
          hero.y = 360;
        } else if (target === 'bridge') {
          hero.x = 1180;
          hero.y = 350;
        }
        hero.vx = 0;
        hero.vy = 0;
        hero.climbing = false;
      };

      // ===================================================================
      // 8. UPDATE LOOP
      // ===================================================================
      function update(dt) {
        if (camera.shakeFrames > 0) camera.shakeFrames--;

        // A. Fireballs
        for (let i = fireballs.length - 1; i >= 0; i--) {
          const fb = fireballs[i];
          fb.x += fb.vx;
          fb.animTimer += dt;
          if (fb.animTimer >= 0.08) {
            fb.animTimer = 0;
            fb.frame = (fb.frame + 1) % 5;
          }
          if (fb.x < -100 || fb.x > WORLD_W + 100) fireballs.splice(i, 1);
        }

        // B. Lava Pillars (Statik & 8-Frame Sequence)
        for (let i = lavaPillars.length - 1; i >= 0; i--) {
          const lp = lavaPillars[i];
          lp.animTimer += dt;

          if (lp.stage === 'warning') {
            lp.warningTimer -= dt;
            if (lp.warningTimer <= 0) {
              lp.stage = 'erupt';
              lp.frame = 0;
              lp.animTimer = 0;
              camera.shakeFrames = 15;
              camera.shakeMag = 6;
            }
          } else if (lp.stage === 'erupt') {
            if (lp.animTimer >= 0.075) {
              lp.animTimer = 0;
              lp.frame++;
              if (lp.frame >= 8) {
                lavaPillars.splice(i, 1);
                continue;
              }
            }
          }
        }

        // C. Ladder Detection
        const hMidX = hero.x + hero.w * 0.5;
        const hFootY = hero.y + hero.h;
        let nearLadder = null;

        for (const l of ladders) {
          if (hMidX >= l.x - 12 && hMidX <= l.x + l.w + 12 && hFootY >= l.topY - 14 && hero.y <= l.bottomY + 14) {
            nearLadder = l;
            break;
          }
        }

        if (nearLadder && (input.up || input.down) && !hero.actionLock) {
          hero.climbing = true;
          hero.activeLadder = nearLadder;
          hero.vx = 0;
          hero.x = nearLadder.x + (nearLadder.w - hero.w) * 0.5;
        }

        if (hero.climbing) {
          hero.grounded = true;
          hero.vy = 0;

          if (input.up) hero.y -= 3.2;
          else if (input.down) hero.y += 3.2;

          if (hero.y + hero.h < hero.activeLadder.topY - 4) {
            hero.y = hero.activeLadder.topY - hero.h;
            hero.climbing = false;
          } else if (hero.y + hero.h > hero.activeLadder.bottomY) {
            hero.y = hero.activeLadder.bottomY - hero.h;
            hero.climbing = false;
          }

          if (input.left || input.right) hero.climbing = false;
        } else {
          // Normal horizontal movement
          if (input.left) { hero.vx = -hero.speed; hero.facing = -1; }
          else if (input.right) { hero.vx = hero.speed; hero.facing = 1; }
          else { hero.vx *= 0.78; if (Math.abs(hero.vx) < 0.1) hero.vx = 0; }

          if (hero.grounded) hero.coyoteTimer = 7;
          else if (hero.coyoteTimer > 0) hero.coyoteTimer--;

          if (hero.jumpBuffer > 0) hero.jumpBuffer--;
          if (hero.jumpBuffer > 0 && hero.coyoteTimer > 0) {
            hero.vy = -12.4;
            hero.grounded = false;
            hero.coyoteTimer = 0;
            hero.jumpBuffer = 0;
          }

          hero.vy += GRAVITY;
          if (hero.vy > 12) hero.vy = 12;
          input.jumpPressed = false;

          const prevFoot = hero.y + hero.h;
          
          // Anjak X terlebih dahulu
          hero.x += hero.vx;

          // ===================================================================
          // SOLID WALL COLLISION CHECK (MENYEKAT PAKSI-X)
          // ===================================================================
          for (const p of platforms) {
            if (p.type === 'wall') {
              if (hero.y + hero.h > p.y && hero.y < p.y + p.h) {
                // Bergerak ke kanan melanggar tepi kiri dinding
                if (hero.vx > 0 && hero.x + hero.w >= p.x && hero.x < p.x) {
                  hero.x = p.x - hero.w;
                  hero.vx = 0;
                }
                // Bergerak ke kiri melanggar tepi kanan dinding
                else if (hero.vx < 0 && hero.x <= p.x + p.w && hero.x + hero.w > p.x + p.w) {
                  hero.x = p.x + p.w;
                  hero.vx = 0;
                }
              }
            }
          }

          // Anjak Y
          hero.y += hero.vy;

          if (hero.x < 20) hero.x = 20;
          if (hero.x > WORLD_W - hero.w - 20) hero.x = WORLD_W - hero.w - 20;

          hero.grounded = false;

          // Perlanggaran Tapak Lantai & Cerun (Paksi-Y)
          for (const p of platforms) {
            if (p.type === 'flat') {
              if (hero.x + hero.w > p.x && hero.x < p.x + p.w && hero.vy >= 0) {
                if (prevFoot <= p.y + 14 && hero.y + hero.h >= p.y) {
                  hero.y = p.y - hero.h;
                  hero.vy = 0;
                  hero.grounded = true;
                  break;
                }
              }
            } else if (p.type === 'ramp') {
              const minX = Math.min(p.x1, p.x2);
              const maxX = Math.max(p.x1, p.x2);
              if (hMidX >= minX && hMidX <= maxX) {
                const progress = (hMidX - p.x1) / (p.x2 - p.x1);
                const targetY = p.y1 + progress * (p.y2 - p.y1);
                if (prevFoot <= targetY + 16 && hero.y + hero.h >= targetY - 4) {
                  hero.y = targetY - hero.h;
                  hero.vy = 0;
                  hero.grounded = true;
                  break;
                }
              }
            }
          }
        }

        // Hero state
        if (hero.climbing) {
          hero.state = 'climb';
        } else if (!hero.grounded) {
          hero.state = hero.vy < 0 ? 'jump' : 'fall';
        } else if (Math.abs(hero.vx) > 0.2) {
          hero.state = 'run';
        } else {
          hero.state = 'idle';
        }

        // Hero Animation (Membeku frame panjat jika diam di tangga)
        const hAct = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
        if (!hero.climbing || (input.up || input.down)) {
          hero.animTimer += dt;
          if (hero.animTimer >= 1 / hAct.fps) {
            hero.animTimer = 0;
            hero.animFrame++;
            if (hero.animFrame >= hAct.count) {
              hero.animFrame = hAct.loop ? 0 : hAct.count - 1;
            }
          }
        }

        // Boss animation
        const bAct = BOSS2_CONFIG.actions[boss.state] || BOSS2_CONFIG.actions.idle;
        boss.animTimer += dt;
        if (boss.animTimer >= 1 / bAct.fps) {
          boss.animTimer = 0;
          boss.animFrame++;

          if (boss.state === 'breathe' && boss.animFrame === 2) {
            window.spawnTestFireball();
          }
          if (boss.state === 'summon' && boss.animFrame === 2) {
            window.spawnTestPillar();
          }

          if (boss.animFrame >= bAct.count) {
            if (bAct.loop) {
              boss.animFrame = 0;
            } else {
              boss.state = 'idle';
              boss.animFrame = 0;
            }
          }
        }

        camera.targetX = Math.max(0, Math.min(WORLD_W - VIEW_W, hero.x - VIEW_W * 0.42));
        camera.x += (camera.targetX - camera.x) * 0.08;
      }

      // ===================================================================
      // 9. RENDER LOOP
      // ===================================================================
      function render() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);

        ctx.save();
        let sx = 0, sy = 0;
        if (camera.shakeFrames > 0) {
          sx = (Math.random() - 0.5) * camera.shakeMag * 2;
          sy = (Math.random() - 0.5) * camera.shakeMag * 2;
        }

        ctx.translate(-Math.round(camera.x + sx), sy);

        // A. Backgrounds
        const bg1 = Loaded.get('page1');
        const bg2 = Loaded.get('page2');
        if (bg1) ctx.drawImage(bg1, 0, 0, 960, VIEW_H);
        if (bg2) ctx.drawImage(bg2, 960, 0, 960, VIEW_H);

        // B. Boss 2 (Magma Warden)[cite: 21]
        const bossSheet = Loaded.get('boss2');
        if (bossSheet) {
          const act = BOSS2_CONFIG.actions[boss.state] || BOSS2_CONFIG.actions.idle;
          const cellW = bossSheet.naturalWidth / BOSS2_CONFIG.cols;
          const cellH = bossSheet.naturalHeight / BOSS2_CONFIG.rows;
          const srcX = Math.floor((act.startCol + boss.animFrame) * cellW);
          const srcY = Math.floor(act.row * cellH);

          ctx.save();
          ctx.translate(Math.round(boss.x), boss.y);
          ctx.scale(boss.facing, 1);
          ctx.drawImage(
            bossSheet,
            srcX, srcY, cellW, cellH,
            BOSS2_CONFIG.offsetX, BOSS2_CONFIG.offsetY, BOSS2_CONFIG.renderSize, BOSS2_CONFIG.renderSize
          );
          ctx.restore();
        }

        // C. Fireballs[cite: 22]
        const fbSheet = Loaded.get('fireball');
        fireballs.forEach(fb => {
          ctx.save();
          ctx.translate(Math.round(fb.x), Math.round(fb.y));
          if (fb.vx < 0) ctx.scale(-1, 1);

          if (fbSheet && fbSheet.naturalWidth > 0) {
            const fW = fbSheet.naturalWidth / 5;
            const fH = fbSheet.naturalHeight;
            ctx.drawImage(fbSheet, fb.frame * fW, 0, fW, fH, -40, -27, 80, 55);
          } else {
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        });

        // D. Lava Pillars (Tepat 8 Frame Statik)[cite: 23]
        const lpSheet = Loaded.get('pillar');
        lavaPillars.forEach(lp => {
          ctx.save();
          if (lp.stage === 'warning') {
            ctx.fillStyle = 'rgba(239, 68, 68, 0.65)';
            ctx.fillRect(lp.x - 28, lp.y - 6, 56, 6);
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(lp.x - 14, lp.y - 8, 28, 3);
          } else if (lp.stage === 'erupt' && lpSheet && lpSheet.naturalWidth > 0) {
            const pW = lpSheet.naturalWidth / 8;
            const pH = lpSheet.naturalHeight;
            const renderH = 220;
            const renderW = Math.round(renderH * (pW / pH));

            ctx.drawImage(
              lpSheet,
              lp.frame * pW, 0, pW, pH,
              Math.round(lp.x - renderW * 0.5), lp.y - renderH, renderW, renderH
            );
          }
          ctx.restore();
        });

        // E. Hero Ksatria
        const heroSheet = Loaded.get('hero');
        if (heroSheet) {
          const act = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
          const colsInRow = act.cols || 10;
          const cellW = heroSheet.naturalWidth / colsInRow;
          const cellH = heroSheet.naturalHeight / HERO_CONFIG.rows;
          const srcX = Math.floor((act.startCol + hero.animFrame) * cellW);
          const srcY = Math.floor(act.row * cellH);

          ctx.save();
          ctx.translate(Math.round(hero.x + hero.w * 0.5), Math.round(hero.y + hero.h));
          ctx.scale(hero.facing, 1);
          ctx.drawImage(
            heroSheet,
            srcX, srcY, cellW, cellH,
            HERO_CONFIG.offsetX, HERO_CONFIG.offsetY, HERO_CONFIG.renderSize, HERO_CONFIG.renderSize
          );
          ctx.restore();
        }

        // F. TIANG BATU LUTSINAR (FOREGROUND OVERLAY)
        if (bg1 && bg1.complete) {
          pillars.forEach(pil => {
            if (hero.x + hero.w > pil.x && hero.x < pil.x + pil.w) {
              ctx.save();
              ctx.globalAlpha = pil.alpha;
              const scaleX = bg1.naturalWidth / 960;
              const scaleY = bg1.naturalHeight / 540;
              ctx.drawImage(
                bg1,
                pil.x * scaleX, pil.y * scaleY, pil.w * scaleX, pil.h * scaleY,
                pil.x, pil.y, pil.w, pil.h
              );
              ctx.restore();
            }
          });
        }

        // G. DEBUG OVERLAY [G]
        if (showDebugRoute) {
          ctx.save();
          ctx.lineWidth = 2;
          ctx.font = '7px "Press Start 2P"';

          // Ladders (Cyan)
          ladders.forEach((l, idx) => {
            ctx.strokeStyle = '#06b6d4';
            ctx.fillStyle = 'rgba(6, 182, 212, 0.25)';
            ctx.strokeRect(l.x, l.topY, l.w, l.bottomY - l.topY);
            ctx.fillRect(l.x, l.topY, l.w, l.bottomY - l.topY);
            ctx.fillStyle = '#22d3ee';
            ctx.fillText(`Ladder ${idx+1}`, l.x - 10, l.topY - 8);
          });

          // Platforms (Green), Ramps (Yellow) & Walls (Red)
          platforms.forEach((p, idx) => {
            if (p.type === 'flat') {
              ctx.strokeStyle = '#22c55e';
              ctx.fillStyle = 'rgba(34, 197, 94, 0.2)';
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p.x + p.w, p.y);
              ctx.stroke();
              ctx.fillRect(p.x, p.y, p.w, p.h);
              ctx.fillStyle = '#4ade80';
              ctx.fillText(`[${idx}] ${p.id}`, p.x + 4, p.y - 6);
            } else if (p.type === 'ramp') {
              ctx.strokeStyle = '#facc15';
              ctx.beginPath();
              ctx.moveTo(p.x1, p.y1);
              ctx.lineTo(p.x2, p.y2);
              ctx.stroke();
              const midX = (p.x1 + p.x2) * 0.5;
              const midY = (p.y1 + p.y2) * 0.5;
              ctx.fillStyle = '#fde047';
              ctx.fillText(`[${idx}] Ramp`, midX - 25, midY - 8);
            } else if (p.type === 'wall') {
              ctx.strokeStyle = '#ef4444';
              ctx.fillStyle = 'rgba(239, 68, 68, 0.35)';
              ctx.strokeRect(p.x, p.y, p.w, p.h);
              ctx.fillRect(p.x, p.y, p.w, p.h);
              ctx.fillStyle = '#fca5a5';
              ctx.fillText(`[${idx}] Wall`, p.x - 12, p.y - 6);
            }
          });

          // Invisible Pillars Area (Purple)
          pillars.forEach(pil => {
            ctx.strokeStyle = '#c084fc';
            ctx.fillStyle = 'rgba(192, 132, 252, 0.2)';
            ctx.strokeRect(pil.x, pil.y, pil.w, pil.h);
            ctx.fillRect(pil.x, pil.y, pil.w, pil.h);
            ctx.fillStyle = '#e9d5ff';
            ctx.fillText(pil.id, pil.x + 4, pil.y + 16);
          });

          ctx.restore();
        }

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      Loaded.init(() => {
        requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
</html>
