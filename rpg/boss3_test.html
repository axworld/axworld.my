<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STAGE 3 TESTBENCH — STORM CHIMERA BOSS & AIR PATROL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #030712; color: #f8fafc; font-family: 'Press Start 2P', monospace; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #gameCanvas {
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .hud-glass {
      background: rgba(10, 16, 31, 0.92);
      border: 1.5px solid rgba(245, 158, 11, 0.5);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .test-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #fde047;
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .test-btn:hover { background: #d97706; color: #000; transform: scale(1.04); }
  </style>
</head>
<body class="w-full h-full flex flex-col items-center justify-center bg-[#030712] p-2">

  <div id="canvasFrame" class="relative w-full max-w-[1280px] max-h-[92vh] aspect-video flex items-center justify-center overflow-hidden border-2 border-amber-500/40 rounded-xl bg-slate-950 shadow-2xl">
    <canvas id="gameCanvas" width="960" height="540" class="w-full h-full block"></canvas>

    <!-- STATUS BAR ATAS -->
    <div class="pointer-events-none absolute top-3 inset-x-3 flex justify-between items-center z-20">
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-amber-300">
        STAGE 3 TESTBENCH: FLYING STORM CHIMERA &amp; TEMPEST PATROL
      </div>
      <div class="hud-glass px-3 py-1.5 rounded-lg text-[8px] text-cyan-300">
        CHIMERA HP: <span id="bossHpText" class="text-amber-400">500 / 500</span>
      </div>
    </div>

    <!-- PANDUAN KAWALAN DI BAWAH -->
    <div class="hidden md:flex pointer-events-none absolute bottom-2 inset-x-0 justify-center items-center z-20">
      <div class="hud-glass rounded-lg px-3 py-1 flex items-center gap-3 text-[7px] text-amber-300 font-bold border border-amber-500/40 shadow-lg">
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">A</kbd><kbd class="bg-slate-800 text-cyan-300 px-1 rounded border border-slate-700">D</kbd> MOVE</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-amber-300 px-1.5 rounded border border-slate-700">SPACE</kbd> JUMP</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-rose-300 px-1 rounded border border-slate-700">J</kbd> SLASH</span>
        <span class="text-slate-600">|</span>
        <span class="flex items-center gap-1"><kbd class="bg-slate-800 text-amber-400 px-1 rounded border border-slate-700">G</kbd> DEBUG</span>
      </div>
    </div>

    <!-- PANEL BUTANG UJIAN AKSI BOS -->
    <div class="absolute bottom-10 right-3 flex flex-wrap max-w-[280px] justify-end gap-1.5 z-30">
      <button class="test-btn" onclick="forceBossAction('hover')">Flight Hover</button>
      <button class="test-btn bg-cyan-950 text-cyan-200 border-cyan-500" onclick="forceBossAction('tornado')">Tornado Breath</button>
      <button class="test-btn bg-amber-950 text-amber-200 border-amber-500" onclick="forceBossAction('thunder')">Thunder Roar</button>
      <button class="test-btn bg-rose-950 text-rose-200 border-rose-500" onclick="forceBossAction('defeat')">Crash Defeat</button>
      <button class="test-btn bg-purple-950 text-purple-200 border-purple-500" onclick="teleportHero('altar')">TP to Altar</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ===================================================================
      // 1. SMART ASSETS LOADER
      // ===================================================================
      const CANDIDATES = {
        hero: ["hero_azzumie_spritesheet.png", "hero_azzumie_spritesheet_3.png"],
        boss3: ["boss3_spritesheet.jpg", "boss3_spritesheet.png"],
        lightning: ["lightning_sprite.png", "lightning_sprite.png"],
        tornado: ["tornado_sprite.png", "tornado_sprite.png"],
        page2: ["stage3_bg_page2.jpg", "stage3_bg_page2_2.png"]
      };

      const Loaded = {
        images: {},
        init(onComplete) {
          const keys = Object.keys(CANDIDATES);
          let count = 0;
          let completed = false;

          const doneCheck = () => {
            if (!completed) {
              completed = true;
              onComplete();
            }
          };

          setTimeout(doneCheck, 2200);

          keys.forEach((k) => {
            const list = CANDIDATES[k];
            let idx = 0;
            const tryNext = () => {
              if (idx >= list.length) {
                count++;
                if (count === keys.length) doneCheck();
                return;
              }
              const src = list[idx++];
              const img = new Image();
              img.onload = () => {
                Loaded.images[k] = img;
                count++;
                if (count === keys.length) doneCheck();
              };
              img.onerror = () => tryNext();
              img.src = src;
            };
            tryNext();
          });
        },
        get(k) {
          const img = this.images[k];
          return (img && img.complete && img.naturalWidth > 0) ? img : null;
        }
      };

      // ===================================================================
      // 2. RETRO AUDIO SYNTH
      // ===================================================================
      const AudioEngine = {
        ctx: null,
        init() {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        },
        playTone(freq, duration, type = 'sine', slideTo = null, vol = 0.2) {
          if (!this.ctx) return;
          try {
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), now + duration);
            gain.gain.setValueAtTime(vol, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch(e){}
        },
        jump() { this.playTone(200, 0.12, 'square', 480, 0.1); },
        slash() { this.playTone(600, 0.09, 'sawtooth', 120, 0.14); },
        hit() { this.playTone(140, 0.14, 'square', 45, 0.22); },
        windWhirl() { this.playTone(320, 0.45, 'sine', 140, 0.25); },
        thunderStrike() {
          this.playTone(110, 0.65, 'sawtooth', 25, 0.4);
          this.playTone(60, 0.70, 'square', 18, 0.35);
        },
        bossCrash() {
          this.playTone(90, 0.7, 'sawtooth', 20, 0.5);
          this.playTone(50, 0.8, 'square', 15, 0.45);
        }
      };

      // ===================================================================
      // 3. CANVAS, KAMERA & FIZIK
      // ===================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const VIEW_W = 960;
      const VIEW_H = 540;
      const GRAVITY = 0.52;

      const camera = { shakeFrames: 0, shakeMag: 0 };
      let showDebug = true;

      // Platform menara mengikut Page 2
      const platforms = [
        { id: 'belfry_floor', type: 'flat', x: 0, y: 445, w: 755, h: 95 },
        { id: 'altar_stairs_ramp', type: 'ramp', x1: 755, y1: 445, x2: 875, y2: 385 },
        { id: 'altar_top_platform', type: 'flat', x: 875, y: 385, w: 90, h: 155 }
      ];

      // ===================================================================
      // 4. KONFIGURASI BOS CHIMERA & HERO
      // ===================================================================
      const CHIMERA_CONFIG = {
        rows: 4,
        cols: 6,
        renderSize: 220,
        offsetX: -110,
        offsetY: -130,
        actions: {
          hover:   { row: 0, startCol: 0, count: 4, fps: 6, loop: true },
          tornado: { row: 1, startCol: 0, count: 5, fps: 7, loop: false },
          thunder: { row: 2, startCol: 0, count: 3, fps: 7, loop: false },
          defeat:  { row: 3, startCol: 0, count: 6, fps: 6, loop: false }
        }
      };

      const boss = {
        x: 520,
        baseY: 210,
        y: 210,
        w: 120,
        h: 90,
        vx: 1.6,
        facing: -1,
        minX: 180,
        maxX: 720,
        hp: 500,
        maxHp: 500,
        state: 'hover',
        animFrame: 0,
        animTimer: 0,
        tiltAngle: 0,
        alive: true,
        crashed: false,
        attackCooldown: 120
      };

      const HERO_CONFIG = {
        rows: 5,
        renderSize: 120,
        offsetX: -60,
        offsetY: -100,
        actions: {
          idle:    { row: 0, cols: 10, startCol: 0, count: 5, fps: 6,  loop: true },
          run:     { row: 1, cols: 8,  startCol: 0, count: 6, fps: 14, loop: true },
          jump:    { row: 2, cols: 10, startCol: 2, count: 1, fps: 1,  loop: false },
          fall:    { row: 2, cols: 10, startCol: 3, count: 1, fps: 1,  loop: false },
          slash:   { row: 3, cols: 9,  startCol: 0, count: 6, fps: 17, loop: false },
          hurt:    { row: 4, cols: 9,  startCol: 5, count: 4, fps: 8,  loop: false }
        }
      };

      const hero = {
        x: 140,
        y: 350,
        w: 48,
        h: 76,
        vx: 0,
        vy: 0,
        speed: 4.5,
        facing: 1,
        hp: 100,
        grounded: false,
        state: 'idle',
        animFrame: 0,
        animTimer: 0,
        actionLock: false,
        coyoteTimer: 0,
        jumpBuffer: 0,
        invulnFrames: 0
      };

      let tornadoes = [];
      let lightningStrikes = [];
      const floatingPopups = [];

      function addFloatingPopup(text, x, y, color = '#f59e0b') {
        floatingPopups.push({ text, x, y, color, life: 60, maxLife: 60 });
      }

      function spawnTornado(startX, startY, dir) {
        tornadoes.push({
          x: startX,
          y: 600,
          vx: dir * 3.2,
          frame: 0,
          animTimer: 0
        });
        AudioEngine.windWhirl();
      }

      function spawnLightning(targetX) {
        lightningStrikes.push({
          x: targetX,
          stage: 'warning',
          timer: 0.7,
          frame: 0,
          animTimer: 0
        });
      }

      // ===================================================================
      // 5. TEST CONTROLS & INPUT
      // ===================================================================
      window.forceBossAction = function (actName) {
        if (!boss.alive) return;
        boss.state = actName;
        boss.animFrame = 0;
        boss.animTimer = 0;
        if (actName === 'defeat') {
          boss.alive = false;
        }
      };

      window.teleportHero = function (target) {
        if (target === 'altar') {
          hero.x = 885;
          hero.y = 385 - hero.h;
        }
        hero.vx = 0;
        hero.vy = 0;
      };

      const input = { left: false, right: false, jumpHeld: false, attackPressed: false };

      function triggerJump() {
        AudioEngine.init();
        hero.jumpBuffer = 8;
      }

      window.addEventListener('keydown', (e) => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        AudioEngine.init();

        if (e.code === 'KeyG') {
          showDebug = !showDebug;
        }
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = true;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = true;
        if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') {
          if (!input.jumpHeld) triggerJump();
          input.jumpHeld = true;
        }
        if (e.code === 'KeyJ' || e.code === 'KeyK') input.attackPressed = true;
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.code === 'ArrowLeft') input.left = false;
        if (e.code === 'KeyD' || e.code === 'ArrowRight') input.right = false;
        if (e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') input.jumpHeld = false;
      });

      // ===================================================================
      // 6. DAMAGE & LOGIK FIZIK
      // ===================================================================
      function inflictDamage(amount, dir) {
        if (hero.invulnFrames > 0) return;
        hero.hp = Math.max(0, hero.hp - amount);
        hero.invulnFrames = 42;
        hero.vx = dir * 4.5;
        hero.vy = -4.0;
        hero.state = 'hurt';
        hero.animFrame = 0;
        hero.animTimer = 0;
        hero.actionLock = true;
        AudioEngine.hit();
        camera.shakeFrames = 10;
        camera.shakeMag = 5;
        addFloatingPopup(`-${amount} HP`, hero.x + 20, hero.y - 10, '#ef4444');
      }

      function update(dt) {
        if (camera.shakeFrames > 0) camera.shakeFrames--;
        if (hero.invulnFrames > 0) hero.invulnFrames--;

        for (let i = floatingPopups.length - 1; i >= 0; i--) {
          const pop = floatingPopups[i];
          pop.y -= 0.6;
          pop.life--;
          if (pop.life <= 0) floatingPopups.splice(i, 1);
        }

        // ===================================================================
        // A. LOGIK TERBANG & AI CHIMERA
        // ===================================================================
        if (boss.alive) {
          // 1. Alunan Terapung Sinusoidal & Rondaan Kiri-Kanan
          if (boss.state === 'hover') {
            boss.x += boss.vx;
            boss.facing = boss.vx > 0 ? 1 : -1;

            // Alunan beralun naik-turun lembut pada paksi-Y
            boss.y = boss.baseY + Math.sin(performance.now() * 0.0035) * 22;

            // Kecondongan inersia badan semasa meluncur
            boss.tiltAngle = (boss.vx > 0 ? 0.08 : -0.08);

            // Pantulan had sempadan rondaan
            if (boss.x >= boss.maxX) { boss.vx = -Math.abs(boss.vx); }
            if (boss.x <= boss.minX) { boss.vx = Math.abs(boss.vx); }

            // Pemasa Serangan Automatik
            boss.attackCooldown -= dt * 60;
            if (boss.attackCooldown <= 0) {
              boss.attackCooldown = 110 + Math.random() * 50;
              const pick = Math.random() > 0.5 ? 'tornado' : 'thunder';
              boss.state = pick;
              boss.animFrame = 0;
              boss.animTimer = 0;
            }
          } else {
            // Semasa menyerang, kecondongan kembali tegak
            boss.tiltAngle *= 0.85;
          }

          // 2. Animasi Sprite Chimera
          const bAct = CHIMERA_CONFIG.actions[boss.state] || CHIMERA_CONFIG.actions.hover;
          boss.animTimer += dt;
          if (boss.animTimer >= 1 / bAct.fps) {
            boss.animTimer = 0;
            boss.animFrame++;

            // Cetusan Hembusan Puting Beliung pada Frame ke-3
            if (boss.state === 'tornado' && boss.animFrame === 3) {
              spawnTornado(boss.x + (boss.facing === 1 ? 50 : -50), boss.y + 40, boss.facing);
            }

            // Cetusan Sambaran Petir pada Frame ke-3
            if (boss.state === 'thunder' && boss.animFrame === 3) {
              spawnLightning(hero.x + hero.w * 0.5);
              AudioEngine.thunderStrike();
            }

            if (boss.animFrame >= bAct.count) {
              if (bAct.loop) {
                boss.animFrame = 0;
              } else {
                boss.state = 'hover';
                boss.animFrame = 0;
              }
            }
          }
        } else {
          // ===================================================================
          // B. ANIMASI TERHEMPAS BILA KALAH (CRASH DEFEAT)
          // ===================================================================
          if (!boss.crashed) {
            boss.baseY += 5.5; // Graviti menjunam ke lantai
            boss.y = boss.baseY;
            boss.tiltAngle = 0.25;

            if (boss.y >= 385) {
              boss.y = 385;
              boss.crashed = true;
              boss.tiltAngle = 0;
              AudioEngine.bossCrash();
              camera.shakeFrames = 25;
              camera.shakeMag = 8;
              addFloatingPopup('STORM CHIMERA CRASHED!', boss.x, boss.y - 40, '#38bdf8');
            }
          }

          const bAct = CHIMERA_CONFIG.actions.defeat;
          boss.animTimer += dt;
          if (boss.animTimer >= 1 / bAct.fps) {
            boss.animTimer = 0;
            boss.animFrame++;
            if (boss.animFrame >= bAct.count) {
              boss.animFrame = bAct.count - 1; // Kekal terbaring di frame terakhir
            }
          }
        }

        // ===================================================================
        // C. KEMAS KINI PUTING BELIUNG
        // ===================================================================
        for (let i = tornadoes.length - 1; i >= 0; i--) {
          const tor = tornadoes[i];
          tor.x += tor.vx;
          tor.animTimer += dt;
          if (tor.animTimer >= 0.08) {
            tor.animTimer = 0;
            tor.frame = (tor.frame + 1) % 6;
          }

          // Perlanggaran dengan Hero
          const hMidX = hero.x + hero.w * 0.5;
          const hFoot = hero.y + hero.h;
          if (hero.invulnFrames <= 0 && Math.abs(hMidX - tor.x) < 35 && hFoot >= 410) {
            inflictDamage(22, Math.sign(tor.vx));
            tornadoes.splice(i, 1);
            continue;
          }

          if (tor.x < -80 || tor.x > VIEW_W + 80) tornadoes.splice(i, 1);
        }

        // ===================================================================
        // D. KEMAS KINI SAMBARAN PETIR (5 FRAME PROGRESSION)
        // ===================================================================
        for (let i = lightningStrikes.length - 1; i >= 0; i--) {
          const lgt = lightningStrikes[i];
          lgt.animTimer += dt;

          if (lgt.stage === 'warning') {
            lgt.timer -= dt;
            if (lgt.timer <= 0) {
              lgt.stage = 'strike';
              lgt.frame = 0;
              lgt.animTimer = 0;
              camera.shakeFrames = 18;
              camera.shakeMag = 6;
            }
          } else if (lgt.stage === 'strike') {
            if (lgt.animTimer >= 0.07) {
              lgt.animTimer = 0;
              lgt.frame++;
              if (lgt.frame >= 5) {
                lightningStrikes.splice(i, 1);
                continue;
              }
            }

            // Damage di frame kilat padu (Frame 1 & 2)
            const hMidX = hero.x + hero.w * 0.5;
            const hFoot = hero.y + hero.h;
            if (lgt.frame >= 1 && lgt.frame <= 2 && hero.invulnFrames <= 0) {
              if (Math.abs(hMidX - lgt.x) < 40 && hFoot >= 420) {
                inflictDamage(30, hero.x < lgt.x ? -1 : 1);
              }
            }
          }
        }

        // ===================================================================
        // E. FIZIK & SERANGAN TETAKAN HERO
        // ===================================================================
        if (!hero.actionLock) {
          if (input.left) { hero.vx = -hero.speed; hero.facing = -1; }
          else if (input.right) { hero.vx = hero.speed; hero.facing = 1; }
          else { hero.vx *= 0.78; if (Math.abs(hero.vx) < 0.1) hero.vx = 0; }

          if (hero.grounded) hero.coyoteTimer = 7;
          else if (hero.coyoteTimer > 0) hero.coyoteTimer--;

          if (hero.jumpBuffer > 0) hero.jumpBuffer--;
          if (hero.jumpBuffer > 0 && hero.coyoteTimer > 0) {
            hero.vy = -12.4;
            hero.grounded = false;
            hero.coyoteTimer = 0;
            hero.jumpBuffer = 0;
            AudioEngine.jump();
          }
        } else {
          hero.vx *= 0.82;
        }

        hero.vy += GRAVITY;
        if (hero.vy > 12) hero.vy = 12;

        const prevFoot = hero.y + hero.h;
        hero.x += hero.vx;
        hero.y += hero.vy;

        if (hero.x < 20) hero.x = 20;
        if (hero.x > VIEW_W - hero.w - 10) hero.x = VIEW_W - hero.w - 10;

        hero.grounded = false;
        const hMidX = hero.x + hero.w * 0.5;

        for (const p of platforms) {
          if (p.type === 'flat') {
            if (hero.x + hero.w > p.x && hero.x < p.x + p.w && hero.vy >= 0) {
              if (prevFoot <= p.y + 14 && hero.y + hero.h >= p.y) {
                hero.y = p.y - hero.h;
                hero.vy = 0;
                hero.grounded = true;
                break;
              }
            }
          } else if (p.type === 'ramp') {
            const minX = Math.min(p.x1, p.x2);
            const maxX = Math.max(p.x1, p.x2);
            if (hMidX >= minX && hMidX <= maxX) {
              const progress = (hMidX - p.x1) / (p.x2 - p.x1);
              const targetY = p.y1 + progress * (p.y2 - p.y1);
              if (prevFoot <= targetY + 16 && hero.y + hero.h >= targetY - 4) {
                hero.y = targetY - hero.h;
                hero.vy = 0;
                hero.grounded = true;
                break;
              }
            }
          }
        }

        if (!hero.actionLock) {
          if (!hero.grounded) hero.state = hero.vy < 0 ? 'jump' : 'fall';
          else if (Math.abs(hero.vx) > 0.2) hero.state = 'run';
          else hero.state = 'idle';
        }

        const hAct = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
        hero.animTimer += dt;
        if (hero.animTimer >= 1 / hAct.fps) {
          hero.animTimer = 0;
          hero.animFrame++;
          if (hero.animFrame >= hAct.count) {
            if (hAct.loop) {
              hero.animFrame = 0;
            } else {
              hero.animFrame = hAct.count - 1;
              if (hero.actionLock) {
                hero.actionLock = false;
                hero.state = hero.grounded ? 'idle' : 'fall';
                hero.animFrame = 0;
              }
            }
          }
        }

        // Tetakan Pedang Menyerang Chimera di Udara
        if (input.attackPressed && !hero.actionLock) {
          input.attackPressed = false;
          hero.actionLock = true;
          hero.state = 'slash';
          hero.animFrame = 0;
          hero.animTimer = 0;
          AudioEngine.slash();

          const slashBox = {
            x: hero.facing === 1 ? hero.x : hero.x - 70,
            y: hero.y - 25,
            w: hero.w + 70,
            h: hero.h + 35
          };

          if (boss.alive) {
            if (slashBox.x + slashBox.w > boss.x - 50 && slashBox.x < boss.x + 50 &&
                slashBox.y + slashBox.h > boss.y - 50 && slashBox.y < boss.y + 50) {
              boss.hp = Math.max(0, boss.hp - 45);
              AudioEngine.hit();
              camera.shakeFrames = 8;
              camera.shakeMag = 4;
              addFloatingPopup('-45', boss.x, boss.y - 40, '#fde047');
              document.getElementById('bossHpText').textContent = `${boss.hp} / ${boss.maxHp}`;

              if (boss.hp <= 0) {
                boss.alive = false;
                boss.state = 'defeat';
                boss.animFrame = 0;
                boss.animTimer = 0;
              }
            }
          }
        }
        input.attackPressed = false;
      }

      // ===================================================================
      // 7. RENDER LOOP
      // ===================================================================
      function render() {
        ctx.clearRect(0, 0, VIEW_W, VIEW_H);

        ctx.save();
        let sx = 0, sy = 0;
        if (camera.shakeFrames > 0) {
          sx = (Math.random() - 0.5) * camera.shakeMag * 2;
          sy = (Math.random() - 0.5) * camera.shakeMag * 2;
        }
        ctx.translate(Math.round(sx), Math.round(sy));

        // A. Latar Belakang Page 2
        const bg2 = Loaded.get('page2');
        if (bg2) ctx.drawImage(bg2, 0, 0, VIEW_W, VIEW_H);
        else { ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }

        // B. Puting Beliung
        const torSheet = Loaded.get('tornado');
        tornadoes.forEach(tor => {
          ctx.save();
          ctx.translate(Math.round(tor.x), tor.y);
          if (torSheet && torSheet.naturalWidth > 0) {
            const fW = torSheet.naturalWidth / 6;
            const fH = torSheet.naturalHeight;

            // ==========================================
            // LARASKAN SAIZ TORNADO DI SINI:
            // Nilai asal: 90
            // Cuba naikkan ke 120 (lebih besar) atau 75 (lebih comel)
            // ==========================================
            const renderH = 400; 

            const renderW = Math.round(renderH * (fW / fH));
            ctx.drawImage(torSheet, tor.frame * fW, 0, fW, fH, -Math.round(renderW * 0.5), -renderH, renderW, renderH);
          } else {
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(-15, -200, 30, 70);
          }
          ctx.restore();
        });

        // C. Sambaran Kilat
        const lgtSheet = Loaded.get('lightning');
        lightningStrikes.forEach(lgt => {
          ctx.save();
          if (lgt.stage === 'warning') {
            const flash = Math.sin(performance.now() * 0.04) > 0;
            ctx.fillStyle = flash ? 'rgba(56, 189, 248, 0.85)' : 'rgba(239, 68, 68, 0.85)';
            ctx.fillRect(lgt.x - 25, 442, 50, 4);
          } else if (lgt.stage === 'strike') {
            if (lgtSheet && lgtSheet.naturalWidth > 0) {
              const fW = lgtSheet.naturalWidth / 5;
              const fH = lgtSheet.naturalHeight;

              // ==========================================
              // LARASKAN KETINGGIAN & KETAPAKAN PETIR DI SINI:
              // Nilai asal: 450 (menjalar dari paras Y=0 ke lantai Y=445)
              // ==========================================
              const renderH = 450; 

              const renderW = Math.round(renderH * (fW / fH));
              ctx.drawImage(lgtSheet, lgt.frame * fW, 0, fW, fH, Math.round(lgt.x - renderW * 0.5), 0, renderW, renderH);
            }
          }
          ctx.restore();
        });

        // D. Bos Chimera (Melayang & Berkecondongan Inersia)
        const bossSheet = Loaded.get('boss3');
        if (bossSheet) {
          const act = CHIMERA_CONFIG.actions[boss.state] || CHIMERA_CONFIG.actions.hover;
          const cellW = bossSheet.naturalWidth / CHIMERA_CONFIG.cols;
          const cellH = bossSheet.naturalHeight / CHIMERA_CONFIG.rows;
          const srcX = Math.floor((act.startCol + boss.animFrame) * cellW);
          const srcY = Math.floor(act.row * cellH);

          ctx.save();
          ctx.translate(Math.round(boss.x), Math.round(boss.y));
          ctx.scale(boss.facing, 1);
          ctx.rotate(boss.tiltAngle);

          ctx.drawImage(
            bossSheet,
            srcX, srcY, cellW, cellH,
            CHIMERA_CONFIG.offsetX, CHIMERA_CONFIG.offsetY,
            CHIMERA_CONFIG.renderSize, CHIMERA_CONFIG.renderSize
          );
          ctx.restore();
        }

        // E. Hero Ksatria
        const heroSheet = Loaded.get('hero');
        if (heroSheet) {
          if (!(hero.invulnFrames > 0 && Math.floor(hero.invulnFrames / 4) % 2 === 1)) {
            const act = HERO_CONFIG.actions[hero.state] || HERO_CONFIG.actions.idle;
            const colsInRow = act.cols || 10;
            const cellW = heroSheet.naturalWidth / colsInRow;
            const cellH = heroSheet.naturalHeight / HERO_CONFIG.rows;
            const srcX = Math.floor((act.startCol + hero.animFrame) * cellW);
            const srcY = Math.floor(act.row * cellH);

            ctx.save();
            ctx.translate(Math.round(hero.x + hero.w * 0.5), Math.round(hero.y + hero.h));
            ctx.scale(hero.facing, 1);
            ctx.drawImage(
              heroSheet,
              srcX, srcY, cellW, cellH,
              HERO_CONFIG.offsetX, HERO_CONFIG.offsetY, HERO_CONFIG.renderSize, HERO_CONFIG.renderSize
            );
            ctx.restore();
          }
        }

        // F. Pop-up Terapung
        floatingPopups.forEach(pop => {
          ctx.save();
          ctx.font = '8px "Press Start 2P"';
          ctx.fillStyle = pop.color;
          ctx.globalAlpha = Math.max(0.1, pop.life / pop.maxLife);
          ctx.fillText(pop.text, pop.x, pop.y);
          ctx.restore();
        });

        // G. Debug Hitbox [G]
        if (showDebug) {
          ctx.save();
          ctx.lineWidth = 2;
          ctx.font = '7px "Press Start 2P"';

          // Platform & Tangga Altar
          platforms.forEach((p, idx) => {
            if (p.type === 'flat') {
              ctx.strokeStyle = '#22c55e';
              ctx.strokeRect(p.x, p.y, p.w, p.h);
            } else if (p.type === 'ramp') {
              ctx.strokeStyle = '#facc15';
              ctx.beginPath();
              ctx.moveTo(p.x1, p.y1);
              ctx.lineTo(p.x2, p.y2);
              ctx.stroke();
            }
          });

          // Hitbox Bos Chimera
          if (boss.alive) {
            ctx.strokeStyle = '#ef4444';
            ctx.strokeRect(boss.x - 50, boss.y - 50, 100, 100);
          }

          ctx.restore();
        }

        ctx.restore();
      }

      let lastTime = performance.now();
      function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }

      Loaded.init(() => {
        requestAnimationFrame(loop);
      });
    })();
  </script>
</body>
